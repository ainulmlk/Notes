 What service is the client requesting?","o":["DHCP","SMTP","DNS","HTTP"],"k":[3],"ref":"Topic 14.4.3","ex":"The transport layer uses port numbers to identify specific applications and services. According to the well-known port assignments, port 80 is reserved for Hypertext Transfer Protocol (HTTP) web services. When a server receives a packet with port 80 as the destination, it identifies the request as a client seeking to access web content, such as HTML pages. This standardized numbering allows the server to simultaneously handle multiple services, distinguishing web traffic from other requests like DNS (port 53) or SMTP (port 25)."},{"n":61,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 67. What service is the client requesting?","o":["FTP","DHCP","Telnet","SSH"],"k":[1],"ref":"Topic 14.4.3","ex":"The transport layer uses port numbers to identify specific applications and services. According to the IANA assignments for well-known ports, port 67 is reserved for the Dynamic Host Configuration Protocol (DHCP) server using the UDP protocol. When a server receives a packet with this destination port, it identifies the request as a client seeking to automatically acquire an IP configuration, including an IP address, subnet mask, and default gateway. While port 68 is used by the DHCP client to receive responses, port 67 is the standard destination for requests sent toward the server."},{"n":75,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 69. What service is the client requesting?","o":["DNS","DHCP","SMTP","TFTP"],"k":[3],"ref":"Topic 14.4.3","ex":"The transport layer uses port numbers to identify and direct data to specific applications or services on a host. According to the standard assignments for well-known ports, port 69 is reserved for the Trivial File Transfer Protocol (TFTP). TFTP is a simple, connectionless protocol that utilizes UDP for best-effort, unacknowledged file delivery, requiring less overhead than FTP. When a server receives a packet with destination port 69, it identifies the request as a client seeking to use this specific file transfer service."},{"n":84,"type":"c","t":"What is the purpose of the TCP sliding window?","o":["to ensure that segments arrive in order at the destination","to end communication when data transmission is complete","to inform a source to retransmit data from a specific point forward","to request that a source decrease the rate at which it transmits data"],"k":[3],"ref":"Topic 14.6.5","ex":"The TCP sliding window allows a destination device to inform a source to slow down the rate of transmission. To do this, the destination device reduces the value contained in the window field of the segment. It is acknowledgment numbers that are used to specify retransmission from a specific point forward. It is sequence numbers that are used to ensure segments arrive in order. Finally, it is a FIN control bit that is used to end a communication session."},{"n":111,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 143. What service is the client requesting?","o":["IMAP","FTP","SSH","Telnet"],"k":[0],"ref":"Topic 14.4.3","ex":"Destination port 143 is the well-known port for IMAP (Internet Message Access Protocol), which enables clients to access and maintain email stored on a mail server."},{"n":112,"type":"c","t":"What are two characteristics shared by TCP and UDP? (Choose two.)","o":["default window size","connectionless communication","port numbering","3-way handshake","ability to to carry digitized voice","use of checksum"],"k":[2,5],"ref":"Topic 14.1.2","ex":"Both TCP and UDP use source and destination port numbers to distinguish different data streams and to forward the right data segments to the right applications. Error checking the header and data is done by both protocols by using a checksum calculation to determine the integrity of the data that is received. TCP is connection-oriented and uses a 3-way handshake to establish an initial connection. TCP also uses window to regulate the amount of traffic sent before receiving an acknowledgment. UDP is connectionless and is the best protocol for carry digitized VoIP signals."},{"n":114,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 21. What service is the client requesting?","o":["FTP","LDAP","SLP","SNMP"],"k":[0],"ref":"Topic 14.4.3","ex":"Destination port 21 is the well-known port used by FTP (File Transfer Protocol) for its control connection. This connection is established by the client to send commands to the server and receive replies, which is essential for managing the file transfer process."},{"n":123,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 22. What service is the client requesting?","o":["SSH","SMB/CIFS","HTTPS","SLP"],"k":[0],"ref":"Topic 14.4.3","ex":"Destination port 22 is the well-known port number reserved for SSH (Secure Shell), which provides a secure remote access connection to network devices and servers. It is considered a secure, encrypted alternative to Telnet, which uses port 23."},{"n":148,"type":"c","t":"Data is being sent from a source PC to a destination server. Which three statements correctly describe the function of TCP or UDP in this situation? (Choose three.)","o":["The source port field identifies the running application or service that will handle data returning to the PC.","The TCP process running on the PC randomly selects the destination port when establishing a session with the server.","UDP segments are encapsulated within IP packets for transport across the network.","The UDP destination port number identifies the application or service on the server which will handle the data.","TCP is the preferred protocol when a function requires lower network overhead.","The TCP source port number identifies the sending host on the network."],"k":[0,2,3],"ref":"Topic 14.4.2","ex":"Layer 4 port numbers identify the application or service which will handle the data. The source port number is added by the sending device and will be the destination port number when the requested information is returned. Layer 4 segments are encapsulated within IP packets. UDP, not TCP, is used when low overhead is needed. A source IP address, not a TCP source port number, identifies the sending host on the network. Destination port numbers are specific ports that a server application or service monitors for requests."},{"n":149,"type":"m","t":"Match each description with the corresponding TCP mechanism.","opts":["window size","sequence numbers","retransmission","acknowledgment"],"items":[{"d":"number of bytes a destination device can accept and process at one time","a":0},{"d":"used to identify missing segments of data","a":1},{"d":"method of managing segments of data loss","a":2},{"d":"received by a sender before transmitting more segments in a session","a":3}],"ref":"Topic 14.6","ex":""}]},{"code":"S09","title":"Application services","desc":"DNS, DHCP, HTTP, email and file transfer protocols.","qs":[{"n":4,"type":"c","t":"Which type of server relies on record types such as A, NS, AAAA, and MX in order to provide services?","o":["DNS","email","file","web"],"k":[0],"ref":"Topic 15.4.2","ex":"A DNS server stores records that are used to resolve IP addresses to host names. Some DNS record types include the following:\n\nA – an end device IPv4 address\nNS – an authoritative name server\nAAAA – an end device IPv6 address\nMX – a mail exchange record"},{"n":6,"type":"c","t":"What service is provided by DNS?","o":["Resolves domain names, such as cisco.com, into IP addresses.","A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web.","Allows for data transfers between a client and a file server.","Uses encryption to secure the exchange of text, graphic images, sound, and video on the web."],"k":[0],"ref":"Topic 15.4.1","ex":"The Domain Name System (DNS) is a foundational application layer protocol designed to automate the translation of human-readable domain names into the numeric IP addresses required for network communication. Because it is impractical for users to memorize complex strings of numbers, DNS provides a hierarchical mapping service that allows individuals to use recognizable names, such as cisco.com, while the network infrastructure continues to route data based on underlying numeric identifiers. This automated resolution process is essential for maintaining connectivity even if a server's numeric IP address changes, as the updated address can simply be re-linked to the existing domain name without impacting the end user's experience. While other protocols like HTTP manage the exchange of web content and FTP handles file transfers, DNS specifically serves as the directory service that ensures requests are directed to the correct destination host."},{"n":16,"type":"c","t":"What service is provided by Internet Messenger?","o":["An application that allows real-time chatting among remote users.","Allows remote access to network devices and servers.","Resolves domain names, such as cisco.com, into IP addresses.","Uses encryption to provide secure remote access to network devices and servers."],"k":[0],"ref":"Topic 1.2.1","ex":"Internet Messenger, widely recognized as instant messaging, is a service that facilitates real-time communication between remote users across a network infrastructure. According to the documentation on host roles, it functions as client software that allows individuals to interact synchronously, enabling the immediate exchange of text and ideas within online communities or organizational settings. Unlike asynchronous services such as email, which follow a store-and-forward model, Internet Messenger supports simultaneous messaging where users can both initiate and receive data in a continuous stream to achieve their communication objectives. This application is essential for modern collaboration, often operating through peer-to-peer or hybrid networking models to ensure that users stay connected across geographic and cultural boundaries."},{"n":25,"type":"c","t":"What service is provided by HTTPS?","o":["Uses encryption to provide secure remote access to network devices and servers.","Resolves domain names, such as cisco.com, into IP addresses.","Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","Allows remote access to network devices and servers."],"k":[2],"ref":"Topic 15.3.2","ex":"Hypertext Transfer Protocol Secure (HTTPS) is the encrypted version of HTTP, designed to provide authentication and secure data transmission across the World Wide Web. While standard HTTP transmits data in plaintext that can be intercepted and read, HTTPS utilizes Secure Socket Layer (SSL) or Transport Layer Security (TLS) to encrypt the data stream as it travels between the client browser and the web server. This encryption specifically protects various types of web content—including text, graphic images, and multimedia files—ensuring that the information remains confidential and has not been altered during transit. Consequently, many organizations implement HTTPS as a security policy to authenticate websites and protect user interactions against data interception and theft."},{"n":31,"type":"c","t":"What service is provided by SMTP?","o":["Allows clients to send email to a mail server and the servers to send email to other servers.","Allows remote access to network devices and servers.","Uses encryption to provide secure remote access to network devices and servers.","An application that allows real-time chatting among remote users."],"k":[0],"ref":"Topic 15.3.4","ex":"The Simple Mail Transfer Protocol (SMTP) is a foundational application layer protocol designed to facilitate the reliable transmission of electronic mail across a network. According to the sources, its primary function is to enable email clients to send messages to a local mail server and to allow those mail servers to further relay messages to other servers across the internet. Unlike retrieval protocols such as POP3 or IMAP, which are used by clients to download or manage mail stored on a server, SMTP specifically handles the outgoing delivery process and requires a properly formatted message header containing recipient and sender addresses. This service operates using a store-and-forward method where messages are spooled and periodically retried if the destination server is temporarily busy or offline, ensuring that communication remains persistent even when immediate end-to-end connectivity is not available."},{"n":53,"type":"c","t":"What is an advantage for small organizations of adopting IMAP instead of POP?","o":["POP only allows the client to store messages in a centralized way, while IMAP allows distributed storage.","Messages are kept in the mail servers until they are manually deleted from the email client.","When the user connects to a POP server, copies of the messages are kept in the mail server for a short time, but IMAP keeps them for a long time.","IMAP sends and retrieves email, but POP only retrieves email."],"k":[1],"ref":"Topic 15.3.4","ex":"IMAP and POP are protocols that are used to retrieve email messages. The advantage of using IMAP instead of POP is that when the user connects to an IMAP-capable server, copies of the messages are downloaded to the client application. IMAP then stores the email messages on the server until the user manually deletes those messages."},{"n":60,"type":"c","t":"What service is provided by HTTP?","o":["Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","Allows for data transfers between a client and a file server.","An application that allows real-time chatting among remote users.","A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web."],"k":[3],"ref":"Topic 15.3.1","ex":"The Hypertext Transfer Protocol (HTTP) is an application layer protocol that defines a specific set of rules for how web browsers (clients) and web servers interact to exchange information across the World Wide Web. It governs the content and formatting of requests and responses, allowing for the successful delivery of various multimedia files, including text, graphic images, sound, and video. Unlike HTTPS, which adds a layer of encryption for security, standard HTTP transmits data in plaintext and relies on the request/response model—such as using GET messages to retrieve HTML pages—to facilitate web communication."},{"n":71,"type":"c","t":"What service is provided by POP3?","o":["Retrieves email from the server by downloading the email to the local mail application of the client.","An application that allows real-time chatting among remote users.","Allows remote access to network devices and servers.","Uses encryption to provide secure remote access to network devices and servers."],"k":[0],"ref":"Topic 15.3.4","ex":"The Post Office Protocol version 3 (POP3) is an application layer protocol designed to enable email clients to retrieve messages from a mail server. According to the sources, the default operation of POP3 is to download the email to the client's local application and then delete it from the server. This service operates over TCP port 110 and is specifically intended for message retrieval, distinguishing it from SMTP, which is used for sending mail, and IMAP, which typically maintains messages on the server."},{"n":88,"type":"c","t":"What service is provided by FTP?","o":["A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web.","An application that allows real-time chatting among remote users.","Allows for data transfers between a client and a file server.","Uses encryption to secure the exchange of text, graphic images, sound, and video on the web."],"k":[2],"ref":"Topic 15.5.1","ex":"The File Transfer Protocol (FTP) is an application layer protocol specifically designed to allow for data transfers between a client and a server. It sets the rules that enable a user on one host to access, upload (push), and download (pull) files to and from another host over a network. FTP is a reliable and connection-oriented protocol that utilizes TCP services, establishing a control connection on port 21 and a separate data connection on port 20 for the actual transfer."},{"n":93,"type":"c","t":"What service is provided by BOOTP?","o":["Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","Allows for data transfers between a client and a file server.","Legacy application that enables a diskless workstation to discover its own IP address and find a BOOTP server on the network.","A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web."],"k":[2],"ref":"Topic 3.3.4","ex":"BOOTP (Bootstrap Protocol) is a precursor to DHCP that allows diskless workstations to automatically discover their own IP address, locate a BOOTP server, and identify a file to be loaded into memory for booting the machine."},{"n":125,"type":"c","t":"What service is provided by DHCP?","o":["An application that allows real-time chatting among remote users.","Allows remote access to network devices and servers.","Dynamically assigns IP addresses to end and intermediary devices.","Uses encryption to provide secure remote access to network devices and servers."],"k":[2],"ref":"Topic 15.4.6","ex":"DHCP (Dynamic Host Configuration Protocol) automates the assignment of IPv4 addresses, subnet masks, default gateways, and other parameters. It allows these addresses to be leased for a period of time and reused when no longer needed, which is more efficient than manual static addressing."}]},{"code":"S10","title":"Network security","desc":"Threats, malware, AAA, firewalls, VPN, SSH hardening.","qs":[{"n":10,"type":"c","t":"What characteristic describes a virus?","o":["a network device that filters access and traffic coming into a network","the use of stolen credentials to access private data","an attack that slows or crashes a device or network service","malicious software or code running on an end device"],"k":[3],"ref":"Topic 16.2.1","ex":"A virus is a specific type of malware defined as malicious software or code running on an end device, such as a computer, laptop, or mobile phone. Unlike standalone threats, a virus typically propagates by inserting a copy of itself into another program or executable file and remains dormant until a user runs that host file. Once activated, the virus can spread to other systems through network transfers, file sharing, or email attachments, potentially causing damage ranging from minor annoyances to the total destruction of data and system functionality. This distinguishes viruses from other security concepts, such as firewalls which are hardware or software filters, or denial of service attacks which focus on overwhelming network resources."},{"n":24,"type":"c","t":"What characteristic describes a Trojan horse?","o":["malicious software or code running on an end device","an attack that slows or crashes a device or network service","the use of stolen credentials to access private data","a network device that filters access and traffic coming into a network"],"k":[0],"ref":"Topic 16.2.1","ex":"A Trojan horse is a specialized form of malware characterized by malicious software or code running on an end device that intentionally disguises itself as a legitimate program to deceive users. Unlike viruses which attach to existing host programs or worms which are standalone and self-propagating, Trojan horses rely on user interaction—such as opening an email attachment or executing a download—to be loaded and activated on a system. Once executed, the software can perform a variety of illegitimate actions, including the destruction of data, the theft of sensitive information, or the creation of unauthorized back doors that provide threat actors with persistent access to the compromised host. Because they present a harmful payload within a seemingly benign package, Trojan horses are considered a primary external security threat that exploits human trust rather than relying solely on technical system vulnerabilities."},{"n":29,"type":"c","t":"What characteristic describes a DoS attack?","o":["the use of stolen credentials to access private data","a network device that filters access and traffic coming into a network","software that is installed on a user device and collects information about the user","an attack that slows or crashes a device or network service"],"k":[3],"ref":"Topic 16.2.4","ex":"A Denial of Service (DoS) attack is a malicious attempt to prevent legitimate users from accessing network services or resources by intentionally consuming system capacity. According to the sources, the primary characteristic of this attack type is that it is designed to slow or crash the applications and processes running on a network device. While other security threats such as identity theft or spyware focus on stealing data or monitoring user activity, DoS attacks prioritize the disruption of service availability, often leading to significant operational downtime and financial loss for an organization."},{"n":37,"type":"c","t":"A company has a file server that shares a folder named Public. The network security policy specifies that the Public folder is assigned Read-Only rights to anyone who can log into the server while the Edit rights are assigned only to the network admin group. Which component is addressed in the AAA network service framework?","o":["automation","accounting","authentication","authorization"],"k":[3],"ref":"Topic 16.3.4","ex":"After a user is successfully authenticated (logged into the server), the authorization is the process of determining what network resources the user can access and what operations (such as read or edit) the user can perform."},{"n":57,"type":"c","t":"What happens when the transport input ssh command is entered on the switch vty lines?","o":["The SSH client on the switch is enabled.","The switch requires a username/password combination for remote access.","Communication between the switch and remote users is encrypted.","The switch requires remote connections via a proprietary client software."],"k":[2],"ref":"Topic 16.4.4","ex":"The transport input ssh command when entered on the switch vty (virtual terminal lines) will encrypt all inbound controlled telnet connections."},{"n":58,"type":"m","t":"Match the type of threat with the cause.","opts":["electrical threats","hardware threats","environmental threats","maintenance threats"],"items":[{"d":"voltage spikes, insufficient supply voltage (brownouts), unconditioned power (noise), and total power loss","a":0},{"d":"physical damage to servers, routers, switches, cabling plant, and workstations","a":1},{"d":"temperature extremes (too hot or too cold) or humidity extremes (too wet or too dry)","a":2},{"d":"poor handling of key electrical components (electrostatic discharge), lack of critical spare parts, poor cabling, and poor labeling","a":3}],"ref":"Topic 16.1.3","ex":""},{"n":59,"type":"c","t":"A disgruntled employee is using some free wireless networking tools to determine information about the enterprise wireless networks. This person is planning on using this information to hack the wireless network. What type of attack is this?","o":["DoS","access","reconnaissance","Trojan horse"],"k":[2],"ref":"Topic 16.2.2","ex":"A reconnaissance attack is the unauthorized discovery and documentation of various computing networks, network systems, resources, applications, services, or vulnerabilities."},{"n":65,"type":"c","t":"What characteristic describes antispyware?","o":["applications that protect end devices from becoming infected with malicious software","a network device that filters access and traffic coming into a network","software on a router that filters traffic based on IP addresses or applications","a tunneling protocol that provides remote users with secure access into the network of an organization"],"k":[0],"ref":"Topic 1.8.2","ex":"Antispyware refers to specialized applications designed to protect end devices—such as PCs, laptops, and smartphones—from being compromised by malicious software. While other security tools like firewalls or VPNs focus on filtering network traffic or creating secure tunnels, antispyware operates at the host level to detect and prevent software that secretly collects information about the user. It is considered a fundamental security component for both home and corporate networks, often implemented alongside antivirus software as part of a layered defense strategy to maintain device integrity."},{"n":66,"type":"c","t":"A network administrator needs to keep the user ID, password, and session contents private when establishing remote CLI connectivity with a switch to manage it. Which access method should be chosen?","o":["Telnet","AUX","SSH","Console"],"k":[2],"ref":"Topic 2.1.4","ex":"SSH (Secure Shell) is the recommended method for establishing a remote CLI connection because it utilizes encryption to ensure that user IDs, passwords, and all session contents remain private and unreadable if intercepted. In contrast, Telnet is considered insecure because it transmits all data, including login credentials, in plaintext. While the Console and AUX ports provide administrative access, they are primarily intended for out-of-band management rather than secure remote connectivity over a standard IP network."},{"n":67,"type":"c","t":"What are the two most effective ways to defend against malware? (Choose two.)","o":["Implement a VPN.","Implement network firewalls.","Implement RAID.","Implement strong passwords.","Update the operating system and other application software.","Install and update antivirus software."],"k":[4,5],"ref":"Topic 16.3.3","ex":"A cybersecurity specialist must be aware of the technologies and measures that are used as countermeasures to protect the organization from threats and vulnerabilities."},{"n":68,"type":"c","t":"Which type of security threat would be responsible if a spreadsheet add-on disables the local software firewall?","o":["brute-force attack","Trojan horse","DoS","buffer overflow"],"k":[1],"ref":"Topic 16.2.1","ex":"A Trojan horse is software that does something harmful, but is hidden in legitimate software code. A denial of service (DoS) attack results in interruption of network services to users, network devices, or applications. A brute-force attack commonly involves trying to access a network device. A buffer overflow occurs when a program attempts to store more data in a memory location than it can hold."},{"n":72,"type":"c","t":"What two security solutions are most likely to be used only in a corporate environment? (Choose two.)","o":["antispyware","virtual private networks","intrusion prevention systems","strong passwords","antivirus software"],"k":[1,2],"ref":"Topic 1.8.2","ex":"While basic security measures like antivirus, antispyware, and firewall filtering are implemented in both home and corporate environments, corporate networks have advanced requirements due to their complexity. According to the sources, intrusion prevention systems (IPS) are specifically used in these larger environments to identify and stop fast-spreading threats like zero-day attacks. Similarly, virtual private networks (VPN) are corporate-level solutions that provide remote workers with secure, encrypted access into the organization's private network. These components are part of a layered defense-in-depth approach used to protect vital business assets."},{"n":73,"type":"c","t":"What characteristic describes antivirus software?","o":["applications that protect end devices from becoming infected with malicious software","a network device that filters access and traffic coming into a network","a tunneling protocol that provides remote users with secure access into the network of an organization","software on a router that filters traffic based on IP addresses or applications"],"k":[0],"ref":"Topic 1.8.2","ex":"Antivirus and antispyware are applications used to protect end devices (such as PCs, laptops, and smartphones) from being compromised or infected with malicious software. These tools are considered basic security components for both home and small office networks and are often required by corporate security policies to maintain endpoint integrity. While other security measures like firewalls or VPNs focus on network-level protection, antivirus software operates directly on the host to mitigate threats from viruses, worms, and other malware."},{"n":76,"type":"c","t":"An administrator defined a local user account with a secret password on router R1 for use with SSH. Which three additional steps are required to configure R1 to accept only encrypted SSH connections? (Choose three.)","o":["Configure DNS on the router.","Generate two-way pre-shared keys.","Configure the IP domain name on the router.","Generate the SSH keys.","Enable inbound vty SSH sessions.","Enable inbound vty Telnet sessions."],"k":[2,3,4],"ref":"Topic 16.4.4","ex":"To successfully transition a router from insecure Telnet to encrypted SSH, specific configuration steps must be followed according to the sources. Since the local user account is already created, the next requirement is to configure the IP domain name, which is essential for the key generation process. The administrator must then generate the SSH keys (typically RSA keys) using the crypto key generate rsa command to provide the foundation for session encryption. Finally, the VTY lines must be updated to enable inbound SSH sessions via the transport input ssh command. This last step is crucial because it ensures the router only accepts encrypted connections and rejects insecure plaintext protocols like Telnet."},{"n":85,"type":"c","t":"What characteristic describes spyware?","o":["a network device that filters access and traffic coming into a network","software that is installed on a user device and collects information about the user","an attack that slows or crashes a device or network service","the use of stolen credentials to access private data"],"k":[1],"ref":"Topic 1.8.1","ex":"Spyware is a specific type of malicious software (malware) that is installed on an end device—such as a computer or smartphone—often without the user's knowledge. Its primary characteristic is that it secretly collects information about the user, which can include browsing habits, personal data, or sensitive credentials. Unlike other attacks that might aim to crash a system or delete data, spyware focuses on stealthily monitoring activity for the purpose of information theft. It is categorized as a common external security threat that requires host-level protection, such as antispyware applications, to mitigate."},{"n":94,"type":"c","t":"What characteristic describes adware?","o":["a network device that filters access and traffic coming into a network","software that is installed on a user device and collects information about the user","the use of stolen credentials to access private data","an attack that slows or crashes a device or network service"],"k":[1],"ref":"Topic 1.8.1","ex":"Adware and spyware are types of software installed on a user's device that secretly collect information about the user."},{"n":101,"type":"m","t":"Match the firewall function to the type of threat protection it provides to the network.","opts":["application filtering","packet filtering","stateful packet inspection","URL filtering"],"items":[{"d":"prevents access by port number","a":0},{"d":"prevents access based on IP or MAC address","a":1},{"d":"prevents unsolicited incoming sessions","a":2},{"d":"prevents access to websites","a":3}],"ref":"Topic 16.3.6","ex":"Packet filtering prevents or allows access based on IP or MAC addresses. Application filtering prevents or allows access by specific application types based on port numbers. URL filtering prevents or allows access to websites based on specific URLs or keywords. Stateful packet inspection (SPI) requires incoming packets to be legitimate responses to requests from internal hosts; unsolicited packets are blocked unless permitted specifically."},{"n":103,"type":"c","t":"How does the service password-encryption command enhance password security on Cisco routers and switches?","o":["It requires encrypted passwords to be used when connecting remotely to a router or switch with Telnet.","It encrypts passwords that are stored in router or switch configuration files.","It requires that a user type encrypted passwords to gain console access to a router or switch.","It encrypts passwords as they are sent across the network."],"k":[1],"ref":"Topic 2.4.4","ex":"The service password-encryption command encrypts plaintext passwords in the configuration file so that they cannot be viewed by unauthorized users."},{"n":106,"type":"c","t":"What characteristic describes identity theft?","o":["the use of stolen credentials to access private data","software on a router that filters traffic based on IP addresses or applications","software that identifies fast-spreading threats","a tunneling protocol that provides remote users with secure access into the network of an organization"],"k":[0],"ref":"Topic 1.8.1","ex":"Identity theft is a specific type of information theft where a threat actor steals login credentials or personal information to access private data. Once accessed, this information is often used to take over a person's identity to make unauthorized purchases or obtain legal documents."},{"n":124,"type":"c","t":"What characteristic describes an IPS?","o":["a tunneling protocol that provides remote users with secure access into the network of an organization","a network device that filters access and traffic coming into a network","software that identifies fast-spreading threats","software on a router that filters traffic based on IP addresses or applications"],"k":[2],"ref":"Topic 1.8.2","ex":"IPS - An intrusion prevention system (IPS) monitors incoming and outgoing traffic looking for malware, network attack signatures, and more. If it recognizes a threat, it can immediately stop it."},{"n":143,"type":"c","t":"What characteristic describes a VPN?","o":["software on a router that filters traffic based on IP addresses or applications","software that identifies fast-spreading threats","a tunneling protocol that provides remote users with secure access into the network of an organization","a network device that filters access and traffic coming into a network"],"k":[2],"ref":"Topic 1.8.2","ex":"A VPN (Virtual Private Network) uses a router to create secure encrypted tunnels that provide remote workers with secure access to an organization's network resources. This connection allows a remote user to access internal servers as if they were a host directly within the intranet."}]},{"code":"S11","title":"Cisco IOS & troubleshooting","desc":"IOS configuration, verification commands, ping, tracert, baselines.","qs":[{"n":8,"type":"c","t":"What command can be used on a Windows PC to see the IP configuration of that computer?","o":["show ip interface brief","ping","show interfaces","ipconfig"],"k":[3],"ref":"Topic 17.5.1","ex":"The ipconfig command is the primary utility used on a Windows-based computer to display its current IP configuration, including the IPv4 and IPv6 addresses, subnet mask, and default gateway. While networking devices like routers and switches use Cisco IOS commands such as show ip interface brief or show interfaces to verify their own configurations, Windows hosts rely on ipconfig to provide a summary of network settings directly from the command prompt. For a more comprehensive view that includes physical (MAC) addresses and DNS server details, the command can be extended with the /all switch"},{"n":44,"type":"c","t":"Which two statements describe how to assess traffic flow patterns and network traffic types using a protocol analyzer? (Choose two.)","o":["Capture traffic on the weekends when most employees are off work.","Capture traffic during peak utilization times to get a good representation of the different traffic types.","Only capture traffic in the areas of the network that receive most of the traffic such as the data center.","Perform the capture on different network segments.","Only capture WAN traffic because traffic to the web is responsible for the largest amount of traffic on a network."],"k":[1,3],"ref":"Topic 17.3.2","ex":"Traffic flow patterns should be gathered during peak utilization times to get a good representation of the different traffic types. The capture should also be performed on different network segments because some traffic will be local to a particular segment."},{"n":48,"type":"c","t":"What will happen if the default gateway address is incorrectly configured on a host?","o":["The host cannot communicate with other hosts in the local network.","The host cannot communicate with hosts in other networks.","A ping from the host to 127.0.0.1 would not be successful.","The host will have to use ARP to determine the correct address of the default gateway.","The switch will not forward packets initiated by the host."],"k":[1],"ref":"Topic 10.3.1","ex":"When a host needs to send a message to another host located on the same network, it can forward the message directly. However, when a host needs to send a message to a remote network, it must use the router, also known as the default gateway. This is because the data link frame address of the remote destination host cannot be used directly. Instead, the IP packet has to be sent to the router (default gateway) and the router will forward the packet toward its destination. Therefore, if the default gateway is incorrectly configured, the host can communicate with other hosts on the same network, but not with hosts on remote networks."},{"n":54,"type":"c","t":"A technician can ping the IP address of the web server of a remote company but cannot successfully ping the URL address of the same web server. Which software utility can the technician use to diagnose the problem?","o":["tracert","ipconfig","netstat","nslookup"],"k":[3],"ref":"Topic 15.4.4","ex":"A ping to the IP address works but a ping to the URL fails, so the problem is name resolution. nslookup lets the technician query the DNS server manually and check that the host name resolves to the right IP address. tracert lists the hops along a path, ipconfig shows the local IP settings, and netstat lists active TCP connections."},{"n":56,"type":"c","t":"The global configuration command ip default-gateway 172.16.100.1 is applied to a switch. What is the effect of this command?","o":["The switch can communicate with other hosts on the 172.16.100.0 network.","The switch can be remotely managed from a host on another network.","The switch is limited to sending and receiving frames to and from the gateway 172.16.100.1.","The switch will have a management interface with the address 172.16.100.1."],"k":[1],"ref":"Topic 10.3.2","ex":"A default gateway address is typically configured on all devices to allow them to communicate beyond just their local network.In a switch this is achieved using the command ip default-gateway \u003cip address>."},{"n":63,"type":"c","t":"A group of Windows PCs in a new subnet has been added to an Ethernet network. When testing the connectivity, a technician finds that these PCs can access local network resources but not the Internet resources. To troubleshoot the problem, the technician wants to initially confirm the IP address and DNS configurations on the PCs, and also verify connectivity to the local router. Which three Windows CLI commands and utilities will provide the necessary information? (Choose three.)","o":["netsh interface ipv6 show neighbor","arp -a","tracert","ping","ipconfig","nslookup","telnet"],"k":[3,4,5],"ref":"Topic 17.5.1","ex":"The ipconfig and nslookup commands will provide initial IP address and DNS configuration information to the technicians and determine if DHCP is assigning correct information to the PCs. The ping utility would be used to verify, or not, connectivity to the default gateway (router) using the configured default gateway address, or using the known correct default gateway address if these are found to be different. The arp -a or netsh interface ipv6 show neighbor commands could be used if the problem is then suspected to be an IP address to MAC address mapping issue. The telnet and tracert utilities could be used to determine where the problem was located in the network if the default gateway configuration was found to be correct."},{"n":81,"type":"c","t":"A new network administrator has been asked to enter a banner message on a Cisco device. What is the fastest way a network administrator could test whether the banner is properly configured?","o":["Enter CTRL-Z at the privileged mode prompt.","Exit global configuration mode.","Power cycle the device.","Reboot the device.","Exit privileged EXEC mode and press Enter ."],"k":[4],"ref":"Topic 2.4.5","ex":"While at the privileged mode prompt such as Router#, type exit,press Enter, and the banner message appears. Power cycling a network device that has had the banner motd command issued will also display the banner message, but this is not a quick way to test the configuration."},{"n":89,"type":"c","t":"A user is attempting to access http://www.cisco.com/ without success. Which two configuration values must be set on the host to allow this access? (Choose two.)","o":["DNS server","source port number","HTTP server","source MAC address","default gateway"],"k":[0,4],"ref":"Topic 11.1.2","ex":"To access a website like http://www.cisco.com/, two critical configuration values are required beyond a basic IP address and subnet mask. First, a DNS server address is necessary to resolve the human-readable domain name into a numeric IP address that the network layer can use for routing. Second, because the website resides on a remote network (the internet), a default gateway must be configured to allow the host to forward packets outside of its local network segment. Without these, the host can neither find the server's IP address nor reach any destination beyond its own local LAN."},{"n":102,"type":"c","t":"Users are reporting longer delays in authentication and in accessing network resources during certain time periods of the week. What kind of information should network engineers check to find out if this situation is part of a normal network behavior?","o":["syslog records and messages","the network performance baseline","debug output and packet captures","network configuration files"],"k":[1],"ref":"Topic 17.4.5","ex":"The network engineers should first establish that the reported performance of the network is in fact abnormal. This is done by referring to the documented network performance baseline.Once it has been verified that the network is not having a proper performance, then specific troubleshooting processes can be applied."},{"n":131,"type":"c","t":"Two pings were issued from a host on a local network. The first ping was issued to the IP address of the default gateway of the host and it failed. The second ping was issued to the IP address of a host outside the local network and it was successful. What is a possible cause for the failed ping?","o":["The default gateway is not operational.","The default gateway device is configured with the wrong IP address.","Security rules are applied to the default gateway device, preventing it from processing ping requests.","The TCP/IP stack on the default gateway is not working properly."],"k":[2],"ref":"Topic 13.2.3","ex":"If the ping from one host to another host on a remote network is successful, this indicates that the default gateway is operational. In this scenario, if a ping from one host to the default gateway failed, it is possible that some security features are applied to the router interface, preventing it from responding to ping requests."},{"n":139,"type":"c","t":"Which information does the show startup-config command display?","o":["the IOS image copied into RAM","the bootstrap program in the ROM","the contents of the current running configuration file in the RAM","the contents of the saved configuration file in the NVRAM"],"k":[3],"ref":"Topic 2.5.1","ex":"The show startup-config command displays the saved configuration located in NVRAM. The show running-config command displays the contents of the currently running configuration file located in RAM.​"},{"n":144,"type":"c","t":"Why would a Layer 2 switch need an IP address?","o":["to enable the switch to send broadcast frames to attached PCs","to enable the switch to function as a default gateway","to enable the switch to be managed remotely","to enable the switch to receive frames from attached PCs"],"k":[2],"ref":"Topic 10.3.2","ex":"A switch, as a Layer 2 device, does not need an IP address to transmit frames to attached devices. However, when a switch is accessed remotely through the network, it must have a Layer 3 address. The IP address must be applied to a virtual interface rather than to a physical interface. Routers, not switches, function as default gateways."},{"n":153,"type":"c","t":"What two pieces of information are displayed in the output of the show ip interface brief command? (Choose two.)","o":["IP addresses","interface descriptions","MAC addresses","next-hop addresses","Layer 1 statuses","speed and duplex settings"],"k":[0,4],"ref":"Topic 10.2.3","ex":"The command show ip interface brief shows the IP address of each interface, as well as the operational status of the interfaces at both Layer 1 and Layer 2. In order to see interface descriptions and speed and duplex settings, use the command show running-config interface. Next-hop addresses are displayed in the routing table with the command show ip route, and the MAC address of an interface can be seen with the command show interfaces."},{"n":154,"type":"c","t":"A user is complaining that an external web page is taking longer than normal to load.The web page does eventually load on the user machine. Which tool should the technician use with administrator privileges in order to locate where the issue is in the network?","o":["ping","nslookup","tracert","ipconfig /displaydns"],"k":[2],"ref":"Topic 17.4.3","ex":"The Command Prompt command tracert will map the path from the PC to the web server and measure transit delays of packets across the network."}]}]};
const KEY = 'ccna1-itnv7-quiz-v1';
const ALL = DATA.sections.flatMap(s => s.qs.map(q => Object.assign({}, q, {sec: s.code})));
const byN = {}; ALL.forEach(q => byN[q.n] = q);
let store = {q: {}, best: null};
try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw && raw.q) store = raw; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const app = document.getElementById('app');
let view = {name: 'home'};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const WORDS = ['', 'one', 'two', 'three', 'four'];

function isCorrect(q, sel) {
  if (!sel) return false;
  if (q.type === 'm') return q.items.every((it, i) => sel[i] === it.a);
  return sel.length === q.k.length && q.k.every(i => sel.includes(i));
}
function complete(q, sel) {
  if (!sel) return false;
  if (q.type === 'm') return q.items.every((_, i) => sel[i] !== undefined && sel[i] >= 0);
  return sel.length === q.k.length;
}
function answerText(q, sel, correctOnly) {
  if (q.type === 'm') {
    return q.items.map((it, i) => {
      const pick = correctOnly ? it.a : (sel && sel[i] !== undefined ? sel[i] : -1);
      return it.d + '  →  ' + (pick >= 0 ? q.opts[pick] : '(no answer)');
    }).join('\n');
  }
  const idx = correctOnly ? q.k : (sel || []);
  return idx.length ? idx.map(i => q.o[i]).join('\n') : '(no answer)';
}

/* ---------- state helpers ---------- */
function secQs(code) { return ALL.filter(q => q.sec === code); }
function secStats(code) {
  const qs = secQs(code); let a = 0, c = 0;
  qs.forEach(q => { const r = store.q[q.n]; if (r) { a++; if (r.ok) c++; } });
  return {total: qs.length, a, c};
}
function curQ() { return view.list[view.i]; }
function getSel(q) {
  if (view.mode === 'exam') return view.ans[q.n];
  const r = store.q[q.n]; return r ? r.sel : view.draft[q.n];
}
function isChecked(q) { return view.mode !== 'exam' && !!store.q[q.n]; }
function chipState(q, i) {
  let c = 'chip';
  if (i === view.i) c += ' cur';
  const r = view.mode !== 'exam' && store.q[q.n];
  if (r) c += r.ok ? ' ok' : ' no';
  else if (view.mode === 'exam' ? complete(q, view.ans[q.n]) : false) c += ' sel';
  return c;
}

/* ---------- views ---------- */
function homeHTML() {
  let A = 0, C = 0;
  DATA.sections.forEach(s => { const t = secStats(s.code); A += t.a; C += t.c; });
  const best = store.best;
  return `
  <header>
    <div class="eyebrow">Cisco Networking Academy · ITNv7</div>
    <h1 class="title" style="margin-top:12px">CCNA 1 <b>Final</b> Quiz</h1>
    <p class="sub">${ALL.length} multiple-choice questions in ${DATA.sections.length} sections. Pick a section, answer, then check to see the explanation.</p>
  </header>
  <div class="stats"><span>answered <b>${A}/${ALL.length}</b></span><span>correct <b>${C}</b></span>${best !== null ? `<span>best mock exam <b>${best}%</b></span>` : ''}</div>
  <div class="exam">
    <div><h2>Mock exam</h2><p>60 random questions, no feedback until you submit. 70% to pass.</p></div>
    <button class="btn pri" data-act="exam">Start mock exam</button>
  </div>
  <ul class="rows">${DATA.sections.map(s => {
    const t = secStats(s.code); const w = t.a - t.c;
    const label = t.a === 0 ? 'Start' : (t.a === t.total ? 'Review' : 'Continue');
    return `<li class="row">
      <span class="code">${s.code}</span>
      <h3>${esc(s.title)}</h3>
      <p class="d">${esc(s.desc)}</p>
      <div class="meta"><span>${t.a}/${t.total} answered${t.a ? ' · ' + t.c + ' correct' : ''}</span>
        <div class="bar" role="img" aria-label="${t.c} correct, ${w} wrong, ${t.total - t.a} unanswered"><i class="c" style="width:${t.c / t.total * 100}%"></i><i class="w" style="width:${w / t.total * 100}%"></i></div></div>
      <button class="btn go ${t.a === 0 ? 'pri' : ''}" data-act="start" data-code="${s.code}">${label}</button>
    </li>`;
  }).join('')}</ul>`;
}

function chipsHTML() {
  return view.list.map((q, i) => `<button class="${chipState(q, i)}" data-act="jump" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('');
}

function choiceHTML(q, sel, checked) {
  const multi = q.k.length > 1;
  const type = multi ? 'checkbox' : 'radio';
  return `<div class="opts ${checked ? 'locked' : ''}">${q.o.map((o, i) => {
    const picked = sel && sel.includes(i), right = q.k.includes(i);
    let cls = 'opt', tag = '';
    if (checked) {
      if (right) { cls += ' right'; tag = picked ? 'Correct' : 'Answer'; }
      else if (picked) { cls += ' wrong'; tag = 'Your pick'; }
    } else if (picked) cls += ' picked';
    return `<label class="${cls}"><input type="${type}" name="opt" data-opt="${i}" ${picked ? 'checked' : ''} ${checked ? 'disabled' : ''}><span>${esc(o)}</span><span class="tag">${tag}</span></label>`;
  }).join('')}</div>`;
}
function matchHTML(q, sel, checked) {
  return `<div>${q.items.map((it, i) => {
    const v = sel && sel[i] !== undefined ? sel[i] : -1;
    let cls = 'mrow', fix = '';
    if (checked) { if (v === it.a) cls += ' right'; else { cls += ' wrong'; fix = `<div class="fix">Answer: ${esc(q.opts[it.a])}</div>`; } }
    return `<div class="${cls}"><span>${esc(it.d)}</span>
      <select data-item="${i}" aria-label="Match: ${esc(it.d)}" ${checked ? 'disabled' : ''}>
        <option value="-1" ${v < 0 ? 'selected' : ''}>Select…</option>
        ${q.opts.map((o, j) => `<option value="${j}" ${v === j ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>${fix}</div>`;
  }).join('')}</div>`;
}
function feedbackHTML(q, sel) {
  const ok = isCorrect(q, sel);
  return `<div class="fb ${ok ? 'ok' : 'no'}"><div class="v">${ok ? 'Correct' : 'Not quite'}</div>
    ${q.ex ? `<div class="x">${esc(q.ex)}</div>` : ''}${q.ref ? `<div class="r">${esc(q.ref)}</div>` : ''}</div>`;
}

function quizHTML() {
  const q = curQ(), sel = getSel(q), checked = isChecked(q);
  const last = view.i === view.list.length - 1;
  const exam = view.mode === 'exam';
  const need = q.type === 'm' ? q.items.length : q.k.length;
  const hint = q.type === 'm' ? 'Match every item' : (need > 1 ? `Select ${WORDS[need] || need}` : 'Select one');
  const title = exam ? 'Mock exam' : DATA.sections.find(s => s.code === view.code).title;
  const answered = exam ? view.list.filter(x => complete(x, view.ans[x.n])).length : 0;
  let primary;
  if (exam) {
    primary = last || answered === view.list.length
      ? `<button class="btn pri" data-act="submit">Submit exam (${answered}/${view.list.length})</button>`
      : '';
  } else if (!checked) {
    primary = `<button class="btn pri" id="check" data-act="check" ${complete(q, sel) ? '' : 'disabled'}>Check answer</button>`;
  } else {
    primary = last ? `<button class="btn pri" data-act="summary">See results</button>` : `<button class="btn pri" data-act="next">Next question</button>`;
  }
  return `
  <div class="top">
    <button class="btn link" data-act="home">← all sections</button>
    <span class="eyebrow">${exam ? 'Mock exam' : view.code + ' · ' + esc(title)}</span>
  </div>
  <div class="chips" id="chips">${chipsHTML()}</div>
  <section class="q">
    <div class="qhead"><span>Question ${view.i + 1} of ${view.list.length}</span><span>source #${q.n}</span></div>
    <div class="stem">${esc(q.t)}</div>
    <div class="hint">${hint}</div>
    ${q.type === 'm' ? matchHTML(q, sel, checked) : choiceHTML(q, sel, checked)}
    ${checked ? feedbackHTML(q, sel) : ''}
  </section>
  <div class="nav">
    <button class="btn" data-act="prev" ${view.i === 0 ? 'disabled' : ''}>← Previous</button>
    <div class="grow">
      ${exam && !last ? `<button class="btn" data-act="next">Next →</button>` : ''}
      ${primary}
    </div>
  </div>`;
}

function summaryHTML() {
  const qs = view.list;
  let c = 0, a = 0;
  qs.forEach(q => { const r = store.q[q.n]; if (r) { a++; if (r.ok) c++; } });
  const missed = qs.filter(q => store.q[q.n] && !store.q[q.n].ok);
  const skipped = qs.length - a;
  const sec = DATA.sections.find(s => s.code === view.code);
  return `
  <div class="top"><button class="btn link" data-act="home">← all sections</button><span class="eyebrow">${view.code} · results</span></div>
  <div><h1 class="title" style="font-size:22px">${esc(sec.title)}</h1></div>
  <div class="score">${c}<small> / ${qs.length}</small></div>
  <div class="stats"><span>correct <b>${c}</b></span><span>missed <b>${missed.length}</b></span><span>unanswered <b>${skipped}</b></span></div>
  <div class="chips">${qs.map((q, i) => `<button class="${chipState(q, -1)}" data-act="jump" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div>
  ${missed.length ? `<div class="list"><div class="lbl">Missed questions</div>${missed.map(q => reviewItem(q, store.q[q.n].sel)).join('')}</div>` : ''}
  <div class="nav">
    <button class="btn" data-act="restart">Restart section</button>
    <div class="grow">${missed.length ? `<button class="btn pri" data-act="retry">Retry missed (${missed.length})</button>` : ''}</div>
  </div>`;
}

function reviewItem(q, sel) {
  return `<details><summary><span class="n">#${q.n}</span><span>${esc(q.t.split('\n')[0])}</span></summary><div class="in">
    <div><div class="lbl">Your answer</div><div class="ans b">${esc(answerText(q, sel, false))}</div></div>
    <div><div class="lbl">Correct answer</div><div class="ans g">${esc(answerText(q, null, true))}</div></div>
    ${q.ex ? `<div class="ans">${esc(q.ex)}</div>` : ''}${q.ref ? `<div class="fb"><div class="r">${esc(q.ref)}</div></div>` : ''}
  </div></details>`;
}

function examResultHTML() {
  const qs = view.list; let c = 0; const wrong = [];
  qs.forEach(q => { if (isCorrect(q, view.ans[q.n])) c++; else wrong.push(q); });
  const pct = Math.round(c / qs.length * 100), pass = pct >= 70;
  return `
  <div class="top"><button class="btn link" data-act="home">← all sections</button><span class="eyebrow">Mock exam · results</span></div>
  <div class="score">${pct}<small>%</small></div>
  <span class="verdict ${pass ? 'ok' : 'no'}">${pass ? 'Pass' : 'Below 70%'}</span>
  <div class="stats"><span>correct <b>${c}/${qs.length}</b></span><span>missed <b>${wrong.length}</b></span>${store.best !== null ? `<span>best <b>${store.best}%</b></span>` : ''}</div>
  ${wrong.length ? `<div class="list"><div class="lbl">Missed questions</div>${wrong.map(q => reviewItem(q, view.ans[q.n])).join('')}</div>` : ''}
  <div class="nav"><button class="btn" data-act="home">Back to sections</button><button class="btn pri" data-act="exam">New mock exam</button></div>`;
}

function render() {
  if (view.name === 'home') app.innerHTML = homeHTML();
  else if (view.name === 'quiz') app.innerHTML = quizHTML();
  else if (view.name === 'summary') app.innerHTML = summaryHTML();
  else if (view.name === 'examresult') app.innerHTML = examResultHTML();
  window.scrollTo(0, 0);
}
function updateChrome() {
  const q = curQ();
  const ch = document.getElementById('chips'); if (ch) ch.innerHTML = chipsHTML();
  const b = document.getElementById('check'); if (b) b.disabled = !complete(q, getSel(q));
  if (view.mode === 'exam') render_nav_submit();
}
function render_nav_submit() {
  const btn = document.querySelector('[data-act="submit"]');
  if (btn) btn.textContent = `Submit exam (${view.list.filter(x => complete(x, view.ans[x.n])).length}/${view.list.length})`;
}

/* ---------- actions ---------- */
function startSection(code, list) {
  const qs = list || secQs(code);
  let i = qs.findIndex(q => !store.q[q.n]); if (i < 0) i = 0;
  view = {name: 'quiz', mode: 'sec', code, list: qs, i, draft: {}};
  try { history.replaceState(null, '', '#' + code.toLowerCase()); } catch (e) {}
  render();
}
function startExam() {
  view = {name: 'quiz', mode: 'exam', list: shuffle(ALL).slice(0, 60), i: 0, ans: {}};
  try { history.replaceState(null, '', '#exam'); } catch (e) {}
  render();
}
function goHome() {
  view = {name: 'home'};
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  render();
}
const actions = {
  home: goHome,
  start: el => startSection(el.dataset.code),
  exam: startExam,
  jump: el => { view.i = +el.dataset.i; if (view.name === 'summary') view.name = 'quiz'; render(); },
  prev: () => { view.i--; render(); },
  next: () => { view.i++; render(); },
  check: () => {
    const q = curQ(), sel = view.draft[q.n];
    if (!complete(q, sel)) return;
    store.q[q.n] = {sel, ok: isCorrect(q, sel)}; save(); render();
  },
  summary: () => { view.name = 'summary'; render(); },
  retry: () => {
    const missed = view.list.filter(q => store.q[q.n] && !store.q[q.n].ok);
    missed.forEach(q => delete store.q[q.n]); save();
    startSection(view.code, missed);
  },
  restart: () => { secQs(view.code).forEach(q => delete store.q[q.n]); save(); startSection(view.code); },
  submit: () => {
    let c = 0; view.list.forEach(q => { if (isCorrect(q, view.ans[q.n])) c++; });
    const pct = Math.round(c / view.list.length * 100);
    if (store.best === null || pct > store.best) store.best = pct;
    save(); view.name = 'examresult'; render();
  }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = actions[el.dataset.act]; if (f) f(el);
});
app.addEventListener('change', e => {
  if (view.name !== 'quiz') return;
  const q = curQ(), t = e.target;
  const bag = view.mode === 'exam' ? view.ans : view.draft;
  if (t.dataset.opt !== undefined) {
    const picked = [...app.querySelectorAll('input[data-opt]')].filter(x => x.checked).map(x => +x.dataset.opt);
    bag[q.n] = picked;
    app.querySelectorAll('.opt').forEach(l => l.classList.toggle('picked', l.querySelector('input').checked));
  } else if (t.dataset.item !== undefined) {
    const cur = (bag[q.n] || q.items.map(() => -1)).slice();
    cur[+t.dataset.item] = +t.value; bag[q.n] = cur;
  } else return;
  updateChrome();
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (/^s\d\d$/.test(h) && DATA.sections.some(s => s.code.toLowerCase() === h)) startSection(h.toUpperCase());
  else if (h === 'exam') startExam();
  else if (!h) { view = {name: 'home'}; render(); }
});
(function boot() {
  const h = location.hash.slice(1);
  if (/^s\d\d$/.test(h) && DATA.sections.some(s => s.code.toLowerCase() === h)) startSection(h.toUpperCase());
  else render();
})();
</script>

</body></html>
