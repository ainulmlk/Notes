<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CCNA 1 Final Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow console column. Home lists the 11 sections as ruled rows; a quiz screen shows one question with a numbered map above it. */
:root{
  --bg:#0e1319; --panel:#151c25; --panel2:#1b2430; --line:#283342;
  --fg:#dfe6ee; --mute:#8b99aa; --accent:#f0b04a; --accent-ink:#1a1203;
  --ok:#4cc9a0; --ok-bg:#12312a; --bad:#ff7b72; --bad-bg:#3a1c1e;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5f8; --panel:#ffffff; --panel2:#e9edf3; --line:#cdd6e1;
    --fg:#16202b; --mute:#566577; --accent:#a85f00; --accent-ink:#ffffff;
    --ok:#0b7a58; --ok-bg:#dcf3ea; --bad:#b4261c; --bad-bg:#fbe3e1; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#e9edf3; --line:#cdd6e1;
  --fg:#16202b; --mute:#566577; --accent:#a85f00; --accent-ink:#ffffff;
  --ok:#0b7a58; --ok-bg:#dcf3ea; --bad:#b4261c; --bad-bg:#fbe3e1; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0;text-wrap:balance}
.mono{font-family:var(--mono)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.title{font:700 clamp(26px,6vw,36px)/1.1 var(--mono);letter-spacing:-.02em}
.title b{color:var(--accent);font-weight:700}
.sub{color:var(--mute);margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;font:500 13px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 16px;border-radius:6px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.link{border:0;background:none;padding:0;min-height:0;color:var(--mute);font:500 13px var(--mono)}
.btn.link:hover{color:var(--fg)}
.exam{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border:1px dashed var(--mute);border-radius:8px;padding:16px}
.exam p{color:var(--mute);font-size:14px;margin-top:4px}
.exam h2{font:600 16px var(--mono)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.code{font:700 14px var(--mono);color:var(--accent);grid-row:span 2;align-self:start;padding-top:2px}
.row h3{font:600 17px/1.3 var(--sans)}
.row .d{color:var(--mute);font-size:14px;grid-column:2}
.row .meta{grid-column:2;display:flex;gap:12px;align-items:center;font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.row .meta .bar{flex:1;max-width:200px}
.row .go{grid-column:3;grid-row:1 / span 3;align-self:center}
@media (max-width:520px){.row{grid-template-columns:auto minmax(0,1fr)}.row .go{grid-column:2;grid-row:auto;justify-self:start;margin-top:6px}}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:5px;font:500 12px var(--mono);display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.chip.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chip.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip.sel{background:var(--panel2);border-color:var(--mute)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font:500 12px var(--mono);color:var(--mute)}
.stem{font-size:17px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.hint{font:500 12px var(--mono);color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;border:1px solid var(--line);background:var(--bg);padding:12px 14px;border-radius:6px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover{border-color:var(--mute)}
.opt input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px}
.opt.picked{border-color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.tag{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding-top:4px;white-space:nowrap}
.right .tag{color:var(--ok)} .wrong .tag{color:var(--bad)}
.locked .opt{cursor:default}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15rem);gap:8px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0;padding-top:0}
.mrow span{overflow-wrap:anywhere}
.mrow select{font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:44px}
.mrow.right select{border-color:var(--ok)} .mrow.wrong select{border-color:var(--bad)}
.mrow .fix{grid-column:1 / -1;font:500 12px var(--mono);color:var(--ok)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.fb{border-left:3px solid var(--mute);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--bad)}
.fb .v{font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.fb.ok .v{color:var(--ok)} .fb.no .v{color:var(--bad)}
.fb .x{white-space:pre-line;color:var(--fg);overflow-wrap:anywhere}
.fb .r{font:500 12px var(--mono);color:var(--mute)}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.nav .grow{display:flex;gap:10px;flex-wrap:wrap}
.score{font:700 clamp(44px,12vw,72px)/1 var(--mono);font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--mute);font-weight:500}
.verdict{font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;display:inline-block;width:fit-content}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.no{background:var(--bad-bg);color:var(--bad)}
details{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
summary{padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:baseline;overflow-wrap:anywhere}
summary .n{font:500 12px var(--mono);color:var(--mute);white-space:nowrap}
details .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.lbl{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ans{white-space:pre-line;overflow-wrap:anywhere}
.ans.g{color:var(--ok)} .ans.b{color:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<script>
const DATA = {"sections":[{"code":"S01","title":"Network fundamentals & models","desc":"Network characteristics, protocols, the OSI and TCP/IP models, QoS.","qs":[{"n":3,"type":"c","t":"Which layer of the TCP/IP model provides a route to forward messages through an internetwork?","o":["application","network access","internet","transport"],"k":[2],"ref":"Topic 3.5.3","ex":"The OSI model network layer corresponds directly to the internet layer of the TCP/IP model and is used to describe protocols that address and route messages through an internetwork."},{"n":5,"type":"c","t":"What are proprietary protocols?","o":["protocols developed by private organizations to operate on any vendor hardware","protocols that can be freely used by any organization or vendor","protocols developed by organizations who have control over their definition and operation","a collection of protocols known as the TCP/IP protocol suite"],"k":[2],"ref":"Topic 3.3.4","ex":"Proprietary protocols have their definition and operation controlled by one company or vendor. Some of them can be used by different organizations with permission from the owner. The TCP/IP protocol suite is an open standard, not a proprietary protocol."},{"n":9,"type":"c","t":"A wired laser printer is attached to a home computer. That printer has been shared so that other computers on the home network can also use the printer. What networking model is in use?","o":["client-based","master-slave","point-to-point","peer-to-peer (P2P)"],"k":[3],"ref":"Topic 1.2.2","ex":"Peer-to-peer (P2P) networks have two or more network devices that can share resources such as printers or files without having a dedicated server."},{"n":11,"type":"c","t":"Three bank employees are using the corporate network. The first employee uses a web browser to view a company web page in order to read some announcements. The second employee accesses the corporate database to perform some financial transactions. The third employee participates in an important live audio conference with other corporate managers in branch offices. If QoS is implemented on this network, what will be the priorities from highest to lowest of the different data types?","o":["financial transactions, web page, audio conference","audio conference, financial transactions, web page","financial transactions, audio conference, web page","audio conference, web page, financial transactions"],"k":[1],"ref":"Topic 1.6.4","ex":"QoS mechanisms enable the establishment of queue management strategies that enforce priorities for different categories of application data. Thus, this queuing enables voice data to have priority over transaction data, which has priority over web data."},{"n":13,"type":"c","t":"If Host1 were to transfer a file to the server, what layers of the TCP/IP model would be used?","o":["only application and Internet layers","only Internet and network access layers","only application, Internet, and network access layers","application, transport, Internet, and network access layers","only application, transport, network, data link, and physical layers","application, session, transport, network, data link, and physical layers"],"k":[3],"ref":"Topic 3.5.3","ex":"The TCP/IP model contains the application, transport, internet, and network access layers. A file transfer uses the FTP application layer protocol. The data would move from the application layer through all of the layers of the model and across the network to the file server."},{"n":36,"type":"c","t":"Which two protocols operate at the top layer of the TCP/IP protocol suite? (Choose two.)","o":["TCP","IP","UDP","POP","DNS","Ethernet"],"k":[3,4],"ref":"Topic 3.3.4","ex":"The top layer of the TCP/IP protocol suite is the application layer, which provides the primary interface for network-aware software to interact with the underlying network infrastructure. Within this model, both DNS (Domain Name System) and POP (Post Office Protocol) function at this highest level to facilitate specific user-facing services, such as translating human-readable domain names into numeric IP addresses and enabling the retrieval of email from mail servers. While other protocols like TCP and UDP operate at the transport layer to manage end-to-end communication, and IP operates at the internet layer to handle routing, DNS and POP are responsible for defining the content and formatting of requests and responses for their respective applications. Therefore, they belong to the application layer, ensuring that data is presented in a format that both the source and destination hosts can process effectively."},{"n":38,"type":"c","t":"What three requirements are defined by the protocols used in network communcations to allow message transmission across a network? (Choose three.)","o":["message size","message encoding","connector specifications","media selection","delivery options","end-device installation"],"k":[0,1,4],"ref":"Topic 3.1.5","ex":"Network communication protocols establish specific rules and standards to ensure that data is successfully transmitted and understood by both the sender and the receiver. According to the sources, these protocols define several critical requirements for message transmission, including message encoding, which converts information into an acceptable format for the medium, and message size, which ensures data is broken into manageable pieces that receiving devices can process. Furthermore, protocols specify delivery options—such as unicast, multicast, or broadcast—to determine whether a message is intended for a single individual or a broader group of recipients. By standardizing these elements along with message timing and formatting, protocols facilitate effective communication between diverse devices across the network infrastructure."},{"n":40,"type":"c","t":"An employee of a large corporation remotely logs into the company using the appropriate username and password. The employee is attending an important video conference with a customer concerning a large sale. It is important for the video quality to be excellent during the meeting. The employee is unaware that after a successful login, the connection to the company ISP failed. The secondary connection, however, activated within seconds. The disruption was not noticed by the employee or other employees.\nWhat three network characteristics are described in this scenario? (Choose three.)","o":["security","quality of service","scalability","powerline networking","integrity","fault tolerance"],"k":[0,1,5],"ref":"Topic 1.6.1","ex":"Usernames and passwords relate to network security. Good quality video, to support video conferencing, relates to prioritizing the video traffic with quality of service (QoS). The fact that a connection to an ISP failed and was then restored but went unnoticed by employees relates to the fault tolerant design of the network."},{"n":46,"type":"c","t":"Which three layers of the OSI model map to the application layer of the TCP/IP model? (Choose three.)","o":["application","network","data link","session","presentation","transport"],"k":[0,3,4],"ref":"Topic 15.1.1","ex":"The TCP/IP model consists of four layers: application, transport, internet, and network access. The OSI model consists of seven layers: application, presentation, session, transport, network, data link, and physical. The top three layers of the OSI model: application, presentation, and session map to the application layer of the TCP/IP model."},{"n":96,"type":"m","t":"Match a statement to the related network model.","opts":["peer-to-peer network","peer-to-peer application"],"items":[{"d":"no dedicated server is required","a":0},{"d":"client and server roles are set on a per request basis","a":0},{"d":"requires a specific user interface","a":1},{"d":"a background service is required","a":1}],"ref":"Topic 15.2.2","ex":"Peer-to-peer networks do not require the use of a dedicated server, and devices can assume both client and server roles simultaneously on a per request basis. Because they do not require formalized accounts or permissions, they are best used in limited situations. Peer-to-peer applications require a user interface and background service to be running, and can be used in more diverse situations."},{"n":126,"type":"m","t":"Match the header field with the appropriate layer of the OSI model.","opts":["Layer 2","Layer 3","Layer 4"],"items":[{"d":"802.2 header","a":0},{"d":"FCS (frame check sequence)","a":0},{"d":"destination MAC address","a":0},{"d":"source IP address","a":1},{"d":"TTL","a":1},{"d":"destination port number","a":2},{"d":"Acknowledgement number","a":2}],"ref":"Topic 3.6.3","ex":""},{"n":135,"type":"c","t":"What is a benefit of using cloud computing in networking?","o":["Technology is integrated into every-day appliances allowing them to interconnect with other devices, making them more ‘smart’ or automated.","Network capabilities are extended without requiring investment in new infrastructure, personnel, or software.","End users have the freedom to use personal tools to access information and communicate across a business network.","Home networking uses existing electrical wiring to connect devices to the network wherever there is an electrical outlet, saving the cost of installing data cables."],"k":[1],"ref":"Topic 1.7.6","ex":"Cloud computing extends IT’s capabilities without requiring investment in new infrastructure, training new personnel, or licensing new software. These services are available on-demand and delivered economically to any device anywhere in the world without compromising security or function. BYOD is about end users having the freedom to use personal tools to access information and communicate across a business or campus network. Smart home technology is integrated into every-day appliances allowing them to interconnect with other devices, making them more ‘smart’ or automated. Powerline networking is a trend for home networking that uses existing electrical wiring to connect devices to the network wherever there is an electrical outlet, saving the cost of installing data cables."},{"n":145,"type":"m","t":"Match each description to its corresponding term.","opts":["message encapsulation","message sizing","message encoding"],"items":[{"d":"the process of placing one message format inside another message format","a":0},{"d":"the process of breaking up a long message into individual pieces before being sent over the network","a":1},{"d":"the process of converting information from one format into another acceptable for transmission","a":2}],"ref":"Topic 3.1.5","ex":""},{"n":147,"type":"c","t":"What is an advantage to using a protocol that is defined by an open standard?","o":["A company can monopolize the market.","The protocol can only be run on equipment from a specific vendor.","An open standard protocol is not controlled or regulated by standards organizations.","It encourages competition and promotes choices."],"k":[3],"ref":"Topic 3.4.1","ex":"A monopoly by one company is not a good idea from a user point of view. If a protocol can only be run on one brand, it makes it difficult to have mixed equipment in a network. A proprietary protocol is not free to use. An open standard protocol will in general be implemented by a wide range of vendors."},{"n":152,"type":"m","t":"Match each item to the type of topology diagram on which it is typically identified.","opts":["physical topology diagram","logical topology diagram"],"items":[{"d":"location of a desktop PC in a classroom","a":0},{"d":"path of cables that connect rooms to wiring closets","a":0},{"d":"IP address of a server","a":1}],"ref":"Topic 1.3.2","ex":"A logical topology diagram typically depicts the IP addressing scheme and groupings of devices and ports. A physical topology diagram shows how those devices are connected to each other and the network, focusing on the physical locations of intermediary devices, configured ports, and cabling."}]},{"code":"S02","title":"Physical layer & media","desc":"Copper, fiber and wireless media, interference, cabling standards.","qs":[{"n":2,"type":"c","t":"Which wireless technology has low-power and data rate requirements making it popular in home automation applications?","o":["ZigBee","LoRaWAN","5G","Wi-Fi"],"k":[0],"ref":"Topic 4.6.2","ex":"ZigBee is an IEEE 802.15.4 wireless standard designed for creating personal-area networks. Low energy, power, and data rate requirements make Zigbee a popular protocol for connecting home automation devices."},{"n":19,"type":"c","t":"A network administrator notices that some newly installed Ethernet cabling is carrying corrupt and distorted data signals. The new cabling was installed in the ceiling close to fluorescent lights and electrical equipment. Which two factors may interfere with the copper cabling and result in signal distortion and data corruption? (Choose two.)","o":["crosstalk","extended length of cabling","RFI","EMI","signal attenuation"],"k":[2,3],"ref":"Topic 4.3.1","ex":"Copper cabling transmits data using electrical pulses, which are highly susceptible to distortion from external electromagnetic signals. According to the sources, electromagnetic interference (EMI) and radio frequency interference (RFI) are two primary factors that can corrupt data signals when cabling is positioned near electronic noise sources such as fluorescent lights, electric motors, or other heavy electrical equipment. While signal attenuation is related to the deterioration of a signal over an extended length of cabling and crosstalk involves interference between adjacent wires within the same cable, EMI and RFI represent external environmental disruptions that can change bit values during transmission. To mitigate these specific effects, network administrators must often use shielded cabling or ensure a physical distance between the data cables and potential sources of interference."},{"n":34,"type":"c","t":"What does the term \"attenuation\" mean in data communication?","o":["strengthening of a signal by a networking device","leakage of signals from one cable pair to another","time for a signal to reach its destination","loss of signal strength as distance increases"],"k":[3],"ref":"Topic 4.3.1","ex":"Data is transmitted on copper cables as electrical pulses. A detector in the network interface of a destination device must receive a signal that can be successfully decoded to match the signal sent. However, the farther the signal travels, the more it deteriorates. This is referred to as signal attenuation."},{"n":41,"type":"c","t":"What are two common causes of signal degradation when using UTP cabling? (Choose two.)","o":["improper termination","low-quality shielding in cable","installing cables in conduit","low-quality cable or connectors","loss of light over long distances"],"k":[0,3],"ref":"Topic 4.4.2","ex":"When terminated improperly, each cable is a potential source of physical layer performance degradation."},{"n":80,"type":"c","t":"A network administrator is designing the layout of a new wireless network. Which three areas of concern should be accounted for when building a wireless network? (Choose three.)","o":["extensive cabling","mobility options","packet collision","interference","security","coverage area"],"k":[3,4,5],"ref":"Topic 4.6.1","ex":"The three areas of concern for wireless networks focus on the size of the coverage area, any nearby interference, and providing network security. Extensive cabling is not a concern for wireless networks, as a wireless network will require minimal cabling for providing wireless access to hosts. Mobility options are not a component of the areas of concern for wireless networks."},{"n":108,"type":"c","t":"What are three commonly followed standards for constructing and installing cabling? (Choose three.)","o":["cost per meter (foot)","cable lengths","connector color","pinouts","connector types","tensile strength of plastic insulator"],"k":[1,3,4],"ref":"Topic 4.4.2","ex":"According to the TIA/EIA-568 standard, which governs commercial cabling for LAN environments, several physical elements are defined to ensure consistency and performance. These include cable lengths, the specific connector types used (such as RJ-45), and the wire color-coded pin assignments, commonly referred to as pinouts."},{"n":117,"type":"c","t":"What technique is used with UTP cable to help protect against signal interference from crosstalk?","o":["wrapping a foil shield around the wire pairs","twisting the wires together into pairs","terminating the cable with special grounded connectors","encasing the cables within a flexible plastic sheath"],"k":[1],"ref":"Topic 4.4.1","ex":"To help prevent the effects of crosstalk, UTP cable wires are twisted together into pairs. Twisting the wires together causes the magnetic fields of each wire to cancel each other out."},{"n":122,"type":"c","t":"Which connector is used with twisted-pair cabling in an Ethernet LAN?","o":["LC connector","SC connector","BNC","RJ 11","RJ 45"],"k":[4],"ref":"Topic 4.4.2","ex":"RJ 45 is the connector used with twisted-pair (UTP) cabling in Ethernet LANs. RJ 11 is used for telephone lines, BNC for legacy coaxial cable, and LC and SC for fiber optic cable."},{"n":128,"type":"c","t":"Which wireless technology has low-power and low-data rate requirements making it popular in IoT environments?","o":["Bluetooth","Zigbee","WiMAX","Wi-Fi"],"k":[1],"ref":"Topic 4.6.2","ex":"Zigbee is a specification used for low-data rate, low-power communications. It is intended for applications that require short-range, low data-rates and long battery life. Zigbee is typically used for industrial and Internet of Things (IoT) environments such as wireless light switches and medical device data collection."},{"n":156,"type":"c","t":"A network technician is researching the use of fiber optic cabling in a new technology center. Which two issues should be considered before implementing fiber optic media? (Choose two.)","o":["Fiber optic cabling requires different termination and splicing expertise from what copper cabling requires.","Fiber optic cabling requires specific grounding to be immune to EMI.","Fiber optic cabling is susceptible to loss of signal due to RFI.","Fiber optic cable is able to withstand rough handling.","Fiber optic provides higher data capacity but is more expensive than copper cabling."],"k":[0,4],"ref":"Topic 4.5.6","ex":"Fiber optic media is more expensive than copper cabling used over the same distance. Fiber optic cables use light instead of an electrical signal, so EMI and RFI are not issues. However, fiber optic does require different skills to terminate and splice."}]},{"code":"S03","title":"Data link & Ethernet","desc":"Frames, LLC and MAC sublayers, switching methods, media access.","qs":[{"n":14,"type":"m","t":"Match the characteristic to the forwarding method.","opts":["Cut-through","Store-and-forward"],"items":[{"d":"low latency","a":0},{"d":"may forward runt frames","a":0},{"d":"begins forwarding when the destination address is received","a":0},{"d":"always stores the entire frame","a":1},{"d":"checks the CRC before forwarding","a":1},{"d":"checks the frame length before forwarding","a":1}],"ref":"Topic 7.4.1","ex":"A store-and-forward switch always stores the entire frame before forwarding, and checks its CRC and frame length. A cut-through switch can forward frames before receiving the destination address field, thus presenting less latency than a store-and-forward switch. Because the frame can begin to be forwarded before it is completely received, the switch may transmit a corrupt or runt frame. All forwarding methods require a Layer 2 switch to forward broadcast frames."},{"n":55,"type":"c","t":"Which two functions are performed at the LLC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.)","o":["implements CSMA/CD over legacy shared half-duplex media","enables IPv4 and IPv6 to utilize the same physical medium","integrates Layer 2 flows between 10 Gigabit Ethernet over fiber and 1 Gigabit Ethernet over copper","implements a process to delimit fields within an Ethernet 2 frame","places information in the Ethernet frame that identifies which network layer protocol is being encapsulated by the frame"],"k":[1,4],"ref":"Topic 6.1.2","ex":"The data link layer is actually divided into two sublayers:\n\n+ Logical Link Control (LLC): This upper sublayer defines the software processes that provide services to the network layer protocols. It places information in the frame that identifies which network layer protocol is being used for the frame. This information allows multiple Layer 3 protocols, such as IPv4 and IPv6, to utilize the same network interface and media.\n+ Media Access Control (MAC): This lower sublayer defines the media access processes performed by the hardware. It provides data link layer addressing and delimiting of data according to the physical signaling requirements of the medium and the type of data link layer protocol in use."},{"n":69,"type":"c","t":"Which frame field is created by a source node and used by a destination node to ensure that a transmitted data signal has not been altered by interference, distortion, or signal loss?","o":["User Datagram Protocol field","transport layer error check field","flow control field","frame check sequence field","error correction process field"],"k":[3],"ref":"Topic 6.3.2","ex":"The frame check sequence (FCS) field is a critical part of the data link layer frame trailer used for error detection. During the encapsulation process, a source node performs a mathematical calculation known as a cyclic redundancy check (CRC) on the frame's contents and places the resulting value into the FCS field. The destination node performs the same calculation upon receiving the frame; if the results do not match the value in the FCS field, it indicates that the data has been altered during transmission. This alteration is often caused by external physical factors such as interference, distortion, or signal loss occurring on the network media. By identifying these discrepancies, the data link layer can reject and discard corrupt frames to ensure that only valid data is passed up to the higher layers of the protocol stack."},{"n":77,"type":"c","t":"Which two functions are performed at the MAC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.)","o":["handles communication between upper layer networking software and Ethernet NIC hardware","implements trailer with frame check sequence for error detection","places information in the Ethernet frame that identifies which network layer protocol is being encapsulated by the frame","implements a process to delimit fields within an Ethernet 2 frame","adds Ethernet control information to network protocol data"],"k":[1,3],"ref":"Topic 6.1.2","ex":"The OSI data link layer is divided into two sublayers: LLC and MAC. The MAC (Media Access Control) sublayer is responsible for data encapsulation and media access control. Its data encapsulation functions include frame delimiting, which uses bits to identify and synchronize fields within a frame, and error detection, which involves adding a trailer with a frame check sequence (FCS) to identify transmission errors. Other functions, such as identifying the network layer protocol or handling communication between upper-layer software and hardware, are performed by the LLC sublayer."},{"n":82,"type":"c","t":"What method is used to manage contention-based access on a wireless network?","o":["token passing","CSMA/CA","priority ordering","CSMA/CD"],"k":[1],"ref":"Topic 6.2.8","ex":"Carrier sense multiple access with collision avoidance (CSMA/CA) is used with wireless networking technology to mediate media contention. Carrier sense multiple access with collision detection (CSMA/CD) is used with wired Ethernet technology to mediate media contention. Priority ordering and token passing are not used (or not a method) for media access control."},{"n":83,"type":"c","t":"What is a function of the data link layer?","o":["provides the formatting of data","provides end-to-end delivery of data between hosts","provides delivery of data between two applications","provides for the exchange of frames over a common local media"],"k":[3],"ref":"Topic 6.1.1","ex":"The data link layer (Layer 2) is specifically responsible for the exchange of frames between network interface cards (NICs) over a common local media. It performs this by accepting Layer 3 packets (such as IPv4 or IPv6) and encapsulating them into Layer 2 frames, which include the necessary control information for the local segment. While higher layers focus on end-to-end delivery between remote hosts or formatting data for applications, the data link layer manages how data is placed on and received from the physical medium, ensuring communication between nodes on the same network."},{"n":86,"type":"c","t":"Which switching method drops frames that fail the FCS check?","o":["store-and-forward switching","borderless switching","ingress port buffering","cut-through switching"],"k":[0],"ref":"Topic 7.4.1","ex":"The FCS check is used with store-and-forward switching to drop any frame with a FCS that does not match the FCS calculation that is made by a switch. Cut-through switching does not perform any error checking. Borderless switching is a network architecture, not a switching method. Ingress port buffering is used with store-and-forward switching to support different Ethernet speeds, but it is not a switching method"},{"n":95,"type":"c","t":"When a switch configuration includes a user-defined error threshold on a per-port basis, to which switching method will the switch revert when the error threshold is reached?","o":["cut-through","store-and-forward","fast-forward","fragment-free"],"k":[1],"ref":"Topic 7.4.2","ex":"When a switch is configured for cut-through switching, it can be set to monitor error rates on a per-port basis; if a user-defined error threshold is reached, the port automatically reverts to store-and-forward switching to perform error checking on all frames before forwarding. Once the error rate drops below the threshold, it changes back to cut-through switching."},{"n":97,"type":"c","t":"What are two primary responsibilities of the Ethernet MAC sublayer? (Choose two.)","o":["error detection","frame delimiting","accessing the media","data encapsulation","logical addressing"],"k":[2,3],"ref":"Topic 7.1.3","ex":"The MAC sublayer is primarily responsible for data encapsulation and accessing the media. Data encapsulation includes framing (frame delimiting), addressing, and error detection, while accessing the media involves controlling the hardware (NIC) responsible for sending and receiving signals on the network medium."},{"n":99,"type":"m","t":"Match each type of frame field to its function.","opts":["addressing","error detection","type","frame start"],"items":[{"d":"This field helps to direct the frame toward its destination.","a":0},{"d":"This field checks if the frame has been damaged during the transfer.","a":1},{"d":"This field is used by the LLC to identify the Layer 3 protocol.","a":2},{"d":"This field identifies the beginning of a frame.","a":3}],"ref":"Topic 6.3.2","ex":""},{"n":115,"type":"c","t":"What attribute of a NIC would place it at the data link layer of the OSI model?","o":["attached Ethernet cable","IP address","MAC address","RJ-45 port","TCP/IP protocol stack"],"k":[2],"ref":"Topic 7.2.2","ex":"The data link layer describes media access and physical addressing. The encoding of a MAC address on a NIC places it at that layer. Ports and cables are placed at the physical layer of the OSI model. IP addresses are placed at the network layer. The TCP/IP protocol stack describes a different model."},{"n":137,"type":"c","t":"What is one main characteristic of the data link layer?","o":["It generates the electrical or optical signals that represent the 1 and 0 on the media.","It converts a stream of data bits into a predefined code.","It shields the upper layer protocol from being aware of the physical medium to be used in the communication.","It accepts Layer 3 packets and decides the path by which to forward the packet to a remote network."],"k":[2],"ref":"Topic 6.1.1","ex":"The data link layer (Layer 2) prepares network data for the physical network and enables upper layers to access the media while remaining completely unaware of the type of physical medium used. Without this layer, higher-level protocols like IP would have to be specifically designed to connect to every possible type of media along a delivery path."},{"n":138,"type":"c","t":"What are three characteristics of the CSMA/CD process? (Choose three.)","o":["The device with the electronic token is the only one that can transmit after a collision.","A device listens and waits until the media is not busy before transmitting.","After detecting a collision, hosts can attempt to resume transmission after a random time delay has expired.","All of the devices on a segment see data that passes on the network medium.","A jam signal indicates that the collision has cleared and the media is not busy.","Devices can be configured with a higher transmission priority."],"k":[1,2,3],"ref":"Topic 6.2.7","ex":"The Carrier Sense Multiple Access/Collision Detection (CSMA/CD) process is a contention-based media access control mechanism used on shared media access networks, such as Ethernet. When a device needs to transmit data, it listens and waits until the media is available (quiet), then it will send data. If two devices transmit at the same time, a collision will occur. Both devices will detect the collision on the network. When a device detects a collision, it will stop the data transmission process, wait for a random amount of time, then try again."}]},{"code":"S04","title":"ARP & address resolution","desc":"How MAC and IP addresses work together on a LAN.","qs":[{"n":20,"type":"c","t":"A host is trying to send a packet to a device on a remote LAN segment, but there are currently no mappings in its ARP cache. How will the device obtain a destination MAC address?","o":["It will send the frame and use its own MAC address as the destination.","It will send an ARP request for the MAC address of the destination device.","It will send the frame with a broadcast MAC address.","It will send a request to the DNS server for the destination MAC address.","It will send an ARP request for the MAC address of the default gateway."],"k":[4],"ref":"Topic 9.2.5","ex":"When a source host identifies that a destination IP address resides on a remote network segment, it must forward the packet to its default gateway (the local router) to reach that destination. Because Layer 2 Ethernet frames are designed for local delivery within the same segment, the host requires the physical MAC address of the gateway's interface to encapsulate the IP packet. If the ARP cache does not contain a mapping for the gateway's IP address, the host initiates an ARP request specifically for the default gateway's MAC address. The host does not request the MAC address of the final destination device, as that device is not on the local segment and cannot respond to local Layer 2 broadcast requests. Once the gateway's MAC address is resolved and stored in the cache, the host can successfully transmit the frame to the router for further delivery across the internetwork."},{"n":49,"type":"c","t":"What are two features of ARP? (Choose two.)","o":["When a host is encapsulating a packet into a frame, it refers to the MAC address table to determine the mapping of IP addresses to MAC addresses.","An ARP request is sent to all devices on the Ethernet LAN and contains the IP address of the destination host and its multicast MAC address.","If a host is ready to send a packet to a local destination device and it has the IP address but not the MAC address of the destination, it generates an ARP broadcast.","If no device responds to the ARP request, then the originating node will broadcast the data packet to all devices on the network segment.","If a device receiving an ARP request has the destination IPv4 address, it responds with an ARP reply."],"k":[2,4],"ref":"Topic 9.2.2","ex":"When a node encapsulates a data packet into a frame, it needs the destination MAC address. First it determines if the destination device is on the local network or on a remote network. Then it checks the ARP table (not the MAC table) to see if a pair of IP address and MAC address exists for either the destination IP address (if the destination host is on the local network) or the default gateway IP address (if the destination host is on a remote network). If the match does not exist, it generates an ARP broadcast to seek the IP address to MAC address resolution. Because the destination MAC address is unknown, the ARP request is broadcast with the MAC address FFFF.FFFF.FFFF. Either the destination device or the default gateway will respond with its MAC address, which enables the sending node to assemble the frame. If no device responds to the ARP request, then the originating node will discard the packet because a frame cannot be created."},{"n":62,"type":"c","t":"What are two problems that can be caused by a large number of ARP request and reply messages? (Choose two.)","o":["Switches become overloaded because they concentrate all the traffic from the attached subnets.","The ARP request is sent as a broadcast, and will flood the entire subnet.","The network may become overloaded because ARP reply messages have a very large payload due to the 48-bit MAC address and 32-bit IP address that they contain.","A large number of ARP request and reply messages may slow down the switching process, leading the switch to make many changes in its MAC table.","All ARP request messages must be processed by all nodes on the local network."],"k":[1,4],"ref":"Topic 9.2.8","ex":"ARP requests are sent as broadcasts:\n(1) All nodes will receive them, and they will be processed by software, interrupting the CPU.\n(2) The switch forwards (floods) Layer 2 broadcasts to all ports.\n\nA switch does not change its MAC table based on ARP request or reply messages. The switch populates the MAC table using the source MAC address of all frames. The ARP payload is very small and does not overload the switch."},{"n":110,"type":"m","t":"Match the characteristic to the category.","opts":["IP address","MAC address"],"items":[{"d":"contained in the Layer 3 header","a":0},{"d":"separated into a network portion and a unique identifier","a":0},{"d":"32 or 128 bits","a":0},{"d":"contained in the Layer 2 header","a":1},{"d":"separated into OUI and a unique identifier","a":1},{"d":"48 bits","a":1}],"ref":"Topic 9.1.1","ex":""},{"n":136,"type":"c","t":"Which two statements are correct about MAC and IP addresses during data transmission if NAT is not involved? (Choose two.)","o":["Destination IP addresses in a packet header remain constant along the entire path to a target host.","Destination MAC addresses will never change in a frame that goes across seven routers.","Every time a frame is encapsulated with a new destination MAC address, a new destination IP address is needed.","Destination and source MAC addresses have local significance and change every time a frame goes from one LAN to another.","A packet that has crossed four routers has changed the destination IP address four times."],"k":[0,3],"ref":"Topic 9.1.2","ex":"IP addresses (Layer 3) represent the original source and final destination of a packet and remain constant throughout the entire path across multiple networks, provided NAT is not involved. In contrast, MAC addresses (Layer 2) have local significance only and are used to deliver a frame from one network interface to another within the same network. Every time a packet reaches a router, the Layer 2 frame is stripped off and a new frame with updated source and destination MAC addresses is created for the next segment of the journey."},{"n":146,"type":"c","t":"A user sends an HTTP request to a web server on a remote network. During encapsulation for this request, what information is added to the address field of a frame to indicate the destination?","o":["the network domain of the destination host","the IP address of the default gateway","the MAC address of the destination host","the MAC address of the default gateway"],"k":[3],"ref":"Topic 9.1.2","ex":"A frame is encapsulated with source and destination MAC addresses. The source device will not know the MAC address of the remote host. An ARP request will be sent by the source and will be responded to by the router. The router will respond with the MAC address of its interface, the one which is connected to the same network as the source."}]},{"code":"S05","title":"IPv4 packets & routing","desc":"IPv4 header, TTL, routing tables, forwarding decisions.","qs":[{"n":39,"type":"c","t":"What are two characteristics of IP? (Choose two.)","o":["does not require a dedicated end-to-end connection","operates independently of the network media","retransmits packets if errors occur","re-assembles out of order packets into the correct order at the receiver end","guarantees delivery of packets"],"k":[0,1],"ref":"Topic 8.1.3","ex":"The Internet Protocol (IP) is a connectionless, best effort protocol. This means that IP requires no end-to-end connection nor does it guarantee delivery of packets. IP is also media independent, which means it operates independently of the network media carrying the packets."},{"n":47,"type":"c","t":"If PC1 is sending a packet to PC2 and routing has been configured between the two routers, what will R1 do with the Ethernet frame header attached by PC1?","o":["nothing, because the router has a route to the destination network","open the header and use it to determine whether the data is to be sent out S0/0/0","open the header and replace the destination MAC address with a new one","remove the Ethernet header and configure a new Layer 2 header before sending it out S0/0/0"],"k":[3],"ref":"Topic 6.1.3","ex":"When PC1 forms the various headers attached to the data one of those headers is the Layer 2 header. Because PC1 connects to an Ethernet network, an Ethernet header is used. The source MAC address will be the MAC address of PC1 and the destination MAC address will be that of G0/0 on R1. When R1 gets that information, the router removes the Layer 2 header and creates a new one for the type of network the data will be placed onto (the serial link)."},{"n":64,"type":"c","t":"During the process of forwarding traffic, what will the router do immediately after matching the destination IP address to a network on a directly connected routing table entry?","o":["analyze the destination IP address","switch the packet to the directly connected interface","look up the next-hop address for the packet","discard the traffic after consulting the route table"],"k":[1],"ref":"Topic 8.5.1","ex":"A router receives a packet on an interface and looks at the destination IP address. It consults its routing table and matches the destination IP address to a routing table entry. The router then discovers that it has to send the packet to the next-hop address or out to a directly connected interface. When the destination address is on a directly connected interface, the packet is switched over to that interface."},{"n":74,"type":"c","t":"What mechanism is used by a router to prevent a received IPv4 packet from traveling endlessly on a network?","o":["It checks the value of the TTL field and if it is 0, it discards the packet and sends a Destination Unreachable message to the source host.","It checks the value of the TTL field and if it is 100, it discards the packet and sends a Destination Unreachable message to the source host.","It decrements the value of the TTL field by 1 and if the result is 0, it discards the packet and sends a Time Exceeded message to the source host.","It increments the value of the TTL field by 1 and if the result is 100, it discards the packet and sends a Parameter Problem message to the source host."],"k":[2],"ref":"Topic 8.2.2","ex":"To prevent an IPv4 packet to travel in the network endlessly, TCP/IP protocols use ICMPv4 protocol to provide feedback about issues. When a router receives a packet and decrements the TTL field in the IPv4 packet by 1 and if the result is zero, it discards the packet and sends a Time Exceeded message to the source host."},{"n":140,"type":"c","t":"Which two commands can be used on a Windows host to display the routing table? (Choose two.)","o":["netstat -s","route print","show ip route","netstat -r","tracert"],"k":[1,3],"ref":"Topic 8.4.4","ex":"On a Windows host, the route print or netstat -r commands can be used to display the host routing table. Both commands generate the same output. On a router, the show ip route command is used to display the routing table. The netstat –s command is used to display per-protocol statistics. The tracert command is used to display the path that a packet travels to its destination."},{"n":141,"type":"c","t":"What are two functions that are provided by the network layer? (Choose two.)","o":["directing data packets to destination hosts on other networks","placing data on the network medium","carrying data between processes that are running on source and destination hosts","providing dedicated end-to-end connections","providing end devices with a unique network identifier"],"k":[0,4],"ref":"Topic 8.1.1","ex":"The network layer is primarily concerned with passing data from a source to a destination on another network. IP addresses supply unique identifiers for the source and destination. The network layer provides connectionless, best-effort delivery. Devices rely on higher layers to supply services to processes."},{"n":142,"type":"c","t":"Which two statements describe features of an IPv4 routing table on a router? (Choose two.)​","o":["Directly connected interfaces will have two route source codes in the routing table: C and S .","If there are two or more possible routes to the same destination, the route associated with the higher metric value is included in the routing table.","The netstat -r command can be used to display the routing table of a router.​","The routing table lists the MAC addresses of each active interface.","It stores information about routes derived from the active router interfaces.","If a default static route is configured in the router, an entry will be included in the routing table with source code S ."],"k":[4,5],"ref":"Topic 8.5.6","ex":"The show ip route command is used to display the routing table of the router. In IPv4, directly connected interfaces will have one source code:C. The routing table stores information about directly connected routes and remote routes. An entry in the routing table with a source code of S is included if a default static route is configured on the router."},{"n":155,"type":"c","t":"Which value, that is contained in an IPv4 header field, is decremented by each router that receives a packet?","o":["Header Length","Differentiated Services","Time-to-Live","Fragment Offset"],"k":[2],"ref":"Topic 8.2.2","ex":"When a router receives a packet, the router will decrement the Time-to-Live (TTL) field by one. When the field reaches zero, the receiving router will discard the packet and will send an ICMP Time Exceeded message to the sender."},{"n":158,"type":"c","t":"A user is executing a tracert to a remote device. At what point would a router, which is in the path to the destination device, stop forwarding the packet?","o":["when the router receives an ICMP Time Exceeded message","when the RTT value reaches zero","when the host responds with an ICMP Echo Reply message","when the value in the TTL field reaches zero","when the values of both the Echo Request and Echo Reply messages reach zero"],"k":[3],"ref":"Topic 13.1.4","ex":"When a router receives a traceroute packet, the value in the TTL field is decremented by 1. When the value in the field reaches zero, the receiving router will not forward the packet, and will send an ICMP Time Exceeded message back to the source."}]},{"code":"S06","title":"IPv4 addressing & subnetting","desc":"Address types, subnet masks, subnet sizing, NAT.","qs":[{"n":23,"type":"c","t":"A network administrator is adding a new LAN to a branch office. The new LAN must support 25 connected devices. What is the smallest network mask that the network administrator can use for the new network?","o":["255.255.255.128","255.255.255.192","255.255.255.224","255.255.255.240"],"k":[2],"ref":"Topic 11.7.2","ex":"To support a LAN with 25 connected devices, a network administrator must select a subnet mask that provides a sufficient number of usable host addresses while minimizing the waste of address space. The number of usable hosts is determined by the formula 2n−2, where n represents the number of host bits remaining in the mask. A subnet mask of 255.255.255.224 (which corresponds to a /27 prefix) leaves 5 bits for the host portion, allowing for 30 usable host addresses (25−2=30). This is the most efficient (smallest) block among the choices provided because the next available mask, 255.255.255.240 (/28), only provides 14 usable addresses (24−2=14), which would not accommodate the 25 required devices. By utilizing the /27 mask, the administrator ensures that the requirements of the branch office are met while adhering to the principle of maximizing available subnets by minimizing unused IP addresses."},{"n":27,"type":"c","t":"A network administrator is adding a new LAN to a branch office. The new LAN must support 61 connected devices. What is the smallest network mask that the network administrator can use for the new network?","o":["255.255.255.240","255.255.255.224","255.255.255.192","255.255.255.128"],"k":[2],"ref":"Topic 11.7.2","ex":"To support a LAN with 61 connected devices, the network administrator must select a subnet mask that provides a sufficient number of usable host addresses while minimizing wasted address space. The number of usable hosts is calculated using the formula 2n−2, where n represents the number of host bits remaining in the mask. A subnet mask of 255.255.255.192 (which corresponds to a /26 prefix) leaves 6 bits for the host portion, providing 62 usable host addresses. This is the most efficient (smallest) mask among the choices because the next tighter mask, 255.255.255.224 (/27), only provides 30 usable addresses, which is insufficient for the 61 required devices. While the 255.255.255.128 (/25) mask would also accommodate the devices, it provides 126 usable addresses and would therefore result in a significant number of unused IP addresses compared to the /26 option."},{"n":42,"type":"c","t":"Which subnet would include the address 192.168.1.96 as a usable host address?","o":["192.168.1.64/26","192.168.1.32/27","192.168.1.32/28","192.168.1.64/29"],"k":[0],"ref":"Topic 11.5.2","ex":"For the subnet of 192.168.1.64/26, there are 6 bits for host addresses, yielding 64 possible addresses. However, the first and last subnets are the network and broadcast addresses for this subnet. Therefore, the range of host addresses for this subnet is 192.168.1.65 to 192.168.1.126. The other subnets do not contain the address 192.168.1.96 as a valid host address."},{"n":50,"type":"c","t":"A network administrator is adding a new LAN to a branch office. The new LAN must support 90 connected devices. What is the smallest network mask that the network administrator can use for the new network?","o":["255.255.255.128","255.255.255.240","255.255.255.248","255.255.255.224"],"k":[0],"ref":"Topic 11.7.2","ex":"To support a LAN with 90 connected devices, the network administrator must select a subnet mask that provides a sufficient number of usable host addresses while minimizing wasted address space. The number of usable hosts is calculated using the formula 2n−2, where n represents the number of host bits remaining in the mask. A subnet mask of 255.255.255.128 (which corresponds to a /25 prefix) leaves 7 bits for the host portion, providing 126 usable host addresses. This is the most efficient (smallest) mask among the provided choices because the next tighter mask, 255.255.255.224 (/27), only provides 30 usable addresses, which is insufficient for the 90 required devices. By utilizing the /25 mask, the administrator ensures that the branch office requirements are met while adhering to the principle of maximizing available subnets by minimizing unused IP addresses."},{"n":70,"type":"c","t":"A network administrator is adding a new LAN to a branch office. The new LAN must support 4 connected devices. What is the smallest network mask that the network administrator can use for the new network?","o":["255.255.255.248","255.255.255.0","255.255.255.128","255.255.255.192"],"k":[0],"ref":"Topic 11.7.2","ex":"To support a LAN with 4 connected devices, the network administrator must select a subnet mask that provides a sufficient number of usable host addresses while minimizing wasted address space. The number of usable hosts is calculated using the formula 2n−2, where n represents the number of host bits remaining in the mask. A subnet mask of 255.255.255.248 (which corresponds to a /29 prefix) leaves 3 bits for the host portion, providing 6 usable host addresses. This is the most efficient (smallest) mask among the choices because it satisfies the requirement for 4 devices while leaving fewer unused addresses compared to 255.255.255.192 (/26), 255.255.255.128 (/25), or 255.255.255.0 (/24), which provide 62, 126, and 254 usable addresses respectively."},{"n":90,"type":"c","t":"Which two statements accurately describe an advantage or a disadvantage when deploying NAT for IPv4 in a network? (Choose two.)","o":["NAT adds authentication capability to IPv4.","NAT introduces problems for some applications that require end-to-end connectivity.","NAT will impact negatively on switch performance.","NAT provides a solution to slow down the IPv4 address depletion.","NAT improves packet handling.","NAT causes routing tables to include more information."],"k":[1,3],"ref":"Topic 12.1.1","ex":"Network Address Translation (NAT) is a technology that is implemented within IPv4 networks. One application of NAT is to use private IP addresses inside a network and use NAT to share a few public IP addresses for many internal hosts. In this way it provides a solution to slow down the IPv4 address depletion. However, since NAT hides the actual IP addresses that are used by end devices, it may cause problems for some applications that require end-to-end connectivity."},{"n":105,"type":"c","t":"A network administrator wants to have the same network mask for all networks at a particular small site. The site has the following networks and number of devices:\nIP phones – 22 addresses\nPCs – 20 addresses needed\nPrinters – 2 addresses needed\nScanners – 2 addresses needed\nThe network administrator has deemed that 192.168.10.0/24 is to be the network used at this site. Which single subnet mask would make the most efficient use of the available addresses to use for the four subnetworks?","o":["255.255.255.192","255.255.255.252","255.255.255.240","255.255.255.248","255.255.255.0","255.255.255.224"],"k":[5],"ref":"Topic 11.7.2","ex":"If the same mask is to be used, then the network with the most hosts must be examined for the number of hosts, which in this case is 22 hosts. Thus, 5 host bits are needed. The /27 or 255.255.255.224 subnet mask would be appropriate to use for these networks."},{"n":107,"type":"c","t":"A network administrator is adding a new LAN to a branch office. The new LAN must support 200 connected devices. What is the smallest network mask that the network administrator can use for the new network?","o":["255.255.255.240","255.255.255.0","255.255.255.248","255.255.255.224"],"k":[1],"ref":"Topic 11.7.2","ex":"To support 200 connected devices, the network administrator must choose a mask that provides at least 200 usable host addresses based on the formula 2n−2. A mask with 7 host bits (27−2=126) is insufficient, so 8 host bits are required (28−2=254). A 32-bit IPv4 address with 8 host bits leaves 24 bits for the network portion (/24), which corresponds to the subnet mask 255.255.255.0."},{"n":116,"type":"c","t":"A network administrator is adding a new LAN to a branch office. The new LAN must support 10 connected devices. What is the smallest network mask that the network administrator can use for the new network?","o":["255.255.255.192","255.255.255.248","255.255.255.224","255.255.255.240"],"k":[3],"ref":"Topic 11.5.2","ex":"To support 10 connected devices, you must calculate the number of host bits required using the formula 2n−2. A mask with 3 host bits (23−2=6) is insufficient, so 4 host bits are needed, providing 14 usable host addresses (24−2=14). A 32-bit IPv4 address with 4 host bits leaves 28 bits for the network portion (/28), which corresponds to the subnet mask 255.255.255.240."},{"n":133,"type":"c","t":"What subnet mask is needed if an IPv4 network has 40 devices that need IP addresses and address space is not to be wasted?","o":["255.255.255.0","255.255.255.240","255.255.255.128","255.255.255.192","255.255.255.224"],"k":[3],"ref":"Topic 11.5.2","ex":"In order to accommodate 40 devices, 6 host bits are needed. With 6 bits, 64 addresses are possible, but one address is for the subnet number and one address is for a broadcast. This leaves 62 addresses that can be assigned to network devices. The mask associated with leaving 6 host bits for addressing is 255.255.255.192."},{"n":151,"type":"c","t":"A network administrator wants to have the same subnet mask for three subnetworks at a small site. The site has the following networks and numbers of devices:\nSubnetwork A: IP phones – 10 addresses\nSubnetwork B: PCs – 8 addresses\nSubnetwork C: Printers – 2 addresses\nWhat single subnet mask would be appropriate to use for the three subnetworks?","o":["255.255.255.0","255.255.255.240","255.255.255.248","255.255.255.252"],"k":[1],"ref":"Topic 11.7.2","ex":"If the same mask is to be used, then the network with the most hosts must be examined for number of hosts. Because this is 10 hosts, 4 host bits are needed. The /28 or 255.255.255.240 subnet mask would be appropriate to use for these networks. ​"},{"n":157,"type":"m","t":"Match each description with an appropriate IP address.","opts":["240.2.6.255","169.254.1.5","198.133.219.2","127.0.0.1"],"items":[{"d":"an experimental address","a":0},{"d":"a link-local address","a":1},{"d":"a public address","a":2},{"d":"a loopback address","a":3}],"ref":"Topic 11.3.4","ex":""}]},{"code":"S07","title":"IPv6","desc":"Address types, EUI-64, SLAAC, ICMPv6, header comparison.","qs":[{"n":12,"type":"m","t":"Match the description to the IPv6 addressing component.","opts":["global routing","subnet ID","interface ID"],"items":[{"d":"This network portion of the address is assigned by the provider.","a":0},{"d":"This part of the address is used by an organization to identify subnets.","a":1},{"d":"This part of the address is the equivalent to the host portion of an IPv4 address.","a":2}],"ref":"Topic 12.3.6","ex":""},{"n":45,"type":"c","t":"What is the consequence of configuring a router with the ipv6 unicast-routing global configuration command?​","o":["All router interfaces will be automatically activated.","The IPv6 enabled router interfaces begin sending ICMPv6 Router Advertisement messages.","Each router interface will generate an IPv6 link-local address.​","It statically creates a global unicast address on this router.​"],"k":[1],"ref":"Topic 12.5.1","ex":"The ipv6 unicast-routing global configuration command is a critical step in IPv6 implementation because Cisco routers do not function as IPv6 routers by default. Once this command is issued, the router joins the all-routers multicast group and its IPv6-enabled interfaces begin transmitting ICMPv6 Router Advertisement (RA) messages periodically or in response to host solicitations. These RA messages are essential for dynamic address allocation, as they provide neighboring hosts with vital information such as the network prefix, prefix length, and the default gateway address. While link-local addresses are generated automatically when IPv6 is enabled on an interface, the global unicast routing command is specifically what triggers the router to begin its active role in directing IPv6 traffic and facilitating stateless address autoconfiguration (SLAAC)."},{"n":51,"type":"c","t":"What are two ICMPv6 messages that are not present in ICMP for IPv4? (Choose two.)","o":["Neighbor Solicitation","Destination Unreachable","Host Confirmation","Time Exceeded","Router Advertisement","Route Redirection"],"k":[0,4],"ref":"Topic 13.1.5","ex":"While ICMPv6 maintains several error and informational messages common to ICMPv4—such as Destination Unreachable and Time Exceeded—it introduces enhanced functionality through the Neighbor Discovery Protocol (NDP). According to the sources, specific messages including Neighbor Solicitation and Router Advertisement are unique to ICMPv6 and are utilized to facilitate critical network processes like address resolution, duplicate address detection, and dynamic address allocation. These new messaging types allow IPv6-enabled devices to discover local routers and resolve MAC addresses for known IPv6 addresses more efficiently than the broadcast-based resolution methods used in IPv4 environments."},{"n":78,"type":"c","t":"An IPv6 enabled device sends a data packet with the destination address of FF02::2. What is the target of this packet?​","o":["all IPv6 enabled devices on the local link​","all IPv6 DHCP servers​","all IPv6 enabled devices across the network​","all IPv6 configured routers on the local link​"],"k":[3],"ref":"Topic 12.7.2","ex":"FF02::2 identifies all IPv6 routers that exist on the link or network. FF02::1 is the target for all IPv6 enabled devices on the link or network.​"},{"n":79,"type":"c","t":"What are the three parts of an IPv6 global unicast address? (Choose three.)","o":["subnet ID","subnet mask","broadcast address","global routing prefix","interface ID"],"k":[0,3,4],"ref":"Topic 12.3.5","ex":"The general format for IPv6 global unicast addresses includes a global routing prefix, a subnet ID, and an interface ID. The global routing prefix is the network portion of the address. A typical global routing prefix is /48 assigned by the Internet provider. The subnet ID portion can be used by an organization to create multiple subnetwork numbers. The interface ID is similar to the host portion of an IPv4 address."},{"n":87,"type":"c","t":"Which range of link-local addresses can be assigned to an IPv6-enabled interface?","o":["FEC0::/10","FDEE::/7","FE80::/10","FF00::/8"],"k":[2],"ref":"Topic 12.3.7","ex":"Link-local addresses are in the range of FE80::/10 to FEBF::/10. The original IPv6 specification defined site-local addresses and used the prefix range FEC0::/10, but these addresses were deprecated by the IETF in favor of unique local addresses. FDEE::/7 is a unique local address because it is in the range of FC00::/7 to FDFF::/7. IPv6 multicast addresses have the prefix FF00::/8."},{"n":91,"type":"c","t":"What would be the interface ID of an IPv6 enabled interface with a MAC address of 1C-6F-65-C2-BD-F8 when the interface ID is generated by using the EUI-64 process?","o":["0C6F:65FF:FEC2:BDF8","1E6F:65FF:FEC2:BDF8","C16F:65FF:FEC2:BDF8","106F:65FF:FEC2:BDF8"],"k":[1],"ref":"Topic 12.5.6","ex":"To derive the EUI-64 interface ID by using the MAC address 1C-6F-65-C2-BD-F8, three steps are taken.\n\nChange the seventh bit of the MAC address from a binary 0 to a binary 1 which changes the hex C, into a hex E.\nInsert hex digits FFFE into the middle of the address.\nRewrite the address in IPv6 format.\nThe three steps, when complete, give the interface ID of 1E6F:65FF:FEC2:BDF8."},{"n":100,"type":"c","t":"What is the subnet ID associated with the IPv6 address 2001:DA48:FC5:A4:3D1B::1/64?","o":["2001:DA48::/64​","2001:DA48:FC5::A4:/64​","2001:DA48:FC5:A4::/64​","2001::/64"],"k":[2],"ref":"Topic 12.3.6","ex":"The /64 represents the network and subnet IPv6 fields. The fourth field of hexadecimal digits is referred to as the subnet ID. The subnet ID for this address is 2001:DA48:FC5:A4::0/64."},{"n":104,"type":"c","t":"Which two statements are correct in a comparison of IPv4 and IPv6 packet headers? (Choose two.)","o":["The Source Address field name from IPv4 is kept in IPv6.","The Version field from IPv4 is not kept in IPv6.","The Destination Address field is new in IPv6.","The Header Checksum field name from IPv4 is kept in IPv6.","The Time-to-Live field from IPv4 has been replaced by the Hop Limit field in IPv6."],"k":[0,4],"ref":"Topic 8.3.3","ex":"The IPv6 packet header fields are as follows: Version, Traffic Class, Flow Label, Payload Length, Next Header, Hop Limit, Source Address, and Destination Address. The IPv4 packet header fields include the following: Version, Differentiated Services, Time-to-Live, Protocol, Source IP Address, and Destination IP Address. Both versions have a 4-bit Version field. Both versions have a Source (IP) Address field. IPv4 addresses are 32 bits; IPv6 addresses are 128 bits. The Time-to-Live or TTL field in IPv4 is now called Hop Limit in IPv6, but this field serves the same purpose in both versions. The value in this 8-bit field decrements each time a packet passes through any router. When this value is 0, the packet is discarded and is not forwarded to any other router."},{"n":129,"type":"c","t":"What two ICMPv6 message types must be permitted through IPv6 access control lists to allow resolution of Layer 3 addresses to Layer 2 MAC addresses? (Choose two.)","o":["neighbor solicitations","echo requests","neighbor advertisements","echo replies","router solicitations","router advertisements"],"k":[0,2],"ref":"Topic 9.3.3","ex":"IPv6 performs address resolution (mapping a known Layer 3 IPv6 address to a Layer 2 MAC address) using the Neighbor Discovery (ND) protocol instead of ARP. This process specifically requires Neighbor Solicitation (NS) messages to request the MAC address and Neighbor Advertisement (NA) messages to provide it; therefore, both must be permitted through access control lists for local network communication to function."},{"n":130,"type":"c","t":"A client is using SLAAC to obtain an IPv6 address for its interface. After an address has been generated and applied to the interface, what must the client do before it can begin to use this IPv6 address?","o":["It must send a DHCPv6 INFORMATION-REQUEST message to request the address of the DNS server.","It must send a DHCPv6 REQUEST message to the DHCPv6 server to request permission to use this address.","It must send an ICMPv6 Router Solicitation message to determine what default gateway it should use.","It must send an ICMPv6 Neighbor Solicitation message to ensure that the address is not already in use on the network."],"k":[3],"ref":"Topic 12.5.7","ex":"Stateless DHCPv6 or stateful DHCPv6 uses a DHCP server, but Stateless Address Autoconfiguration (SLAAC) does not. A SLAAC client can automatically generate an address that is based on information from local routers via Router Advertisement (RA) messages. Once an address has been assigned to an interface via SLAAC, the client must ensure via Duplicate Address Detection (DAD) that the address is not already in use. It does this by sending out an ICMPv6 Neighbor Solicitation message and listening for a response. If a response is received, then it means that another device is already using this address."},{"n":132,"type":"c","t":"An organization is assigned an IPv6 address block of 2001:db8:0:ca00::/56. How many subnets can be created without using bits in the interface ID space?","o":["256","512","1024","4096"],"k":[0],"ref":"Topic 12.8.1","ex":"The organization is assigned a /56 prefix. Since a standard IPv6 subnet uses a /64 prefix length to preserve the 64-bit interface ID space, there are 8 bits available for subnetting (64−56=8). Using the formula 2n, where n is the number of bits, 28 allows for the creation of 256 subnets."}]},{"code":"S08","title":"Transport layer","desc":"TCP and UDP, port numbers, windowing, session tracking.","qs":[{"n":1,"type":"c","t":"Which two traffic types use the Real-Time Transport Protocol (RTP)? (Choose two.)","o":["video","web","file transfer","voice","peer to peer"],"k":[0,3],"ref":"Topic 14.3.4","ex":"The Real-Time Transport Protocol (RTP) is a specialized communication protocol designed specifically to facilitate the end-to-end delivery of data with real-time characteristics, such as interactive audio and video. Within the framework of network applications, particularly those utilizing the User Datagram Protocol (UDP) for transport, voice and video traffic are the primary types that leverage RTP. These media-rich transmissions, which include services such as Voice over IP (VoIP) and live multimedia streaming, are highly sensitive to latency and jitter; consequently, they prioritize the rapid, continuous flow of information over the absolute reliability provided by connection-oriented protocols. While applications such as file transfers and web browsing rely on the retransmission and sequencing mechanisms of TCP to ensure data integrity, real-time multimedia streaming accepts a degree of packet loss in favor of maintaining a synchronized and uninterrupted user experience. To manage these requirements effectively, RTP is often deployed in conjunction with the Real-Time Transport Control Protocol (RTCP) to minimize latency issues and ensure the priority delivery of real-time packets across the network infrastructure."},{"n":7,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 110. What service is the client requesting?","o":["DNS","DHCP","SMTP","POP3"],"k":[3],"ref":"Topic 14.4.3","ex":"The transport layer utilizes destination port numbers to identify the specific service or application being requested on a server. According to the standard port assignments defined by the Internet Assigned Numbers Authority (IANA), port 110 is reserved as a well-known port for the Post Office Protocol version 3 (POP3). When a server receives a packet with this destination port, it recognizes that the client is requesting to establish a connection for retrieving email messages. While other ports are used for different mail services—such as port 25 for SMTP or port 143 for IMAP—port 110 specifically signals the server to direct the traffic to the POP3 application process to facilitate the download of mail to the client's local application."},{"n":22,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 53. What service is the client requesting?","o":["DNS","NetBIOS (NetBT)","POP3","IMAP"],"k":[0],"ref":"Topic 14.4.3","ex":"The transport layer utilizes destination port numbers to identify the specific application or service being requested on a destination server. According to the standard assignments defined by the Internet Assigned Numbers Authority (IANA), port 53 is categorized as a well-known port reserved specifically for the Domain Name System (DNS). When a server receives a packet with this destination port, it recognizes that the client is requesting a name resolution service, typically to translate a human-readable domain name into its corresponding numeric IP address. While other services such as POP3 or IMAP utilize their own designated well-known ports (110 and 143 respectively) to facilitate email retrieval, port 53 remains the global standard for DNS queries and responses using both UDP and TCP transport protocols."},{"n":26,"type":"c","t":"A technician with a PC is using multiple applications while connected to the Internet. How is the PC able to keep track of the data flow between multiple application sessions and have each application receive the correct packet flows?","o":["The data flow is being tracked based on the destination MAC address of the technician PC.","The data flow is being tracked based on the source port number that is used by each application.","The data flow is being tracked based on the source IP address that is used by the PC of the technician.","The data flow is being tracked based on the destination IP address that is used by the PC of the technician."],"k":[1],"ref":"Topic 14.4.1","ex":"The source port number of an application is randomly generated and used to individually keep track of each session connecting out to the Internet. Each application will use a unique source port number to provide simultaneous communication from multiple applications through the Internet."},{"n":32,"type":"c","t":"Which scenario describes a function provided by the transport layer?","o":["A student is using a classroom VoIP phone to call home. The unique identifier burned into the phone is a transport layer address used to contact another network device on the same network.","A student is playing a short web-based movie with sound. The movie and sound are encoded within the transport layer header.","A student has two web browser windows open in order to access two web sites. The transport layer ensures the correct web page is delivered to the correct browser window.","A corporate worker is accessing a web server located on a corporate network. The transport layer formats the screen so the web page appears properly no matter what device is being used to view the web site."],"k":[2],"ref":"Topic 14.1.2","ex":"The source and destination port numbers are used to identify the correct application and window within that application."},{"n":52,"type":"c","t":"A client packet is received by a server. The packet has a destination port number of 80.
